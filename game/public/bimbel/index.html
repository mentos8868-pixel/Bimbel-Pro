<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruang Pintar – Contoh Website Latihan Matematika SD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF8EC; --card:#FFFFFF; --ink:#1F2A2E; --muted:#5E6B70; --line:#EADFCB;
    --accent:#F2701D; --accent-dark:#C9550C; --accent-soft:#FFE6D3;
    --ok:#2E9E5B; --ok-soft:#DDF3E6; --bad:#D64545; --bad-soft:#FBE1E1;
    --gold:#F5B400; --teal:#1E8C93; --teal-soft:#D9F0F1;
    --r:16px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:17px;line-height:1.5}
  button{font:inherit;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

  /* Top bar */
  .top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line)}
  .top-in{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-weight:900;font-size:22px;letter-spacing:-.3px}
  .brand b{color:var(--accent)}
  .tag{font-size:11px;font-weight:800;background:var(--teal-soft);color:var(--teal);padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle}
  .spacer{flex:1}
  .stat{display:flex;align-items:center;gap:6px;font-weight:800;background:var(--bg);border:2px solid var(--line);padding:4px 12px;border-radius:99px}
  .me{display:flex;align-items:center;gap:8px;font-weight:800}
  .saldo{font-weight:900;color:#B7860B;background:#FFF4D1;border-radius:999px;padding:4px 10px;font-size:15px;white-space:nowrap}
  .tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:8px}
  .titem{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px}
  .titem.pakai{border-color:var(--ok);background:var(--ok-soft)}
  .titem img{width:110px;height:110px;margin:0 auto;display:block}
  .titem b{font-size:16px}.titem .harga{color:#B7860B;font-weight:900}
  .titem .btn{padding:8px 12px;font-size:15px}
  .tpreview{display:flex;gap:18px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:18px;flex-wrap:wrap}
  .tpreview img{width:120px;height:120px}
  .ava{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:22px;border:2px solid var(--accent);overflow:hidden}
  .ava img{width:100%;height:100%;display:block}
  nav{max-width:1040px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto}
  nav button{background:none;border:0;padding:10px 14px;font-weight:800;color:var(--muted);border-bottom:4px solid transparent}
  nav button.on{color:var(--ink);border-bottom-color:var(--accent)}
  nav a.ke-dash{margin-left:auto;padding:10px 14px;font-weight:800;color:var(--muted);text-decoration:none;white-space:nowrap}
  nav a.ke-dash:hover{color:var(--ink)}

  main{max-width:1040px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:28px;margin:0 0 4px;font-weight:900;letter-spacing:-.4px}
  h2{font-size:20px;margin:0 0 12px;font-weight:900}
  .sub{color:var(--muted);margin:0 0 20px}

  /* Level bar */
  .lvl{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:22px}
  .lvl-badge{background:var(--ink);color:#fff;font-weight:900;border-radius:12px;padding:6px 12px;white-space:nowrap}
  .bar{flex:1;height:14px;background:var(--bg);border-radius:99px;overflow:hidden;border:2px solid var(--line)}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}

  /* Grade chips */
  .grades{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 16px;font-weight:800;min-height:44px}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.soon{opacity:.5;cursor:not-allowed}

  /* Topic path */
  .path{display:grid;gap:12px}
  .topic{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:16px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 18px}
  .topic .num{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:22px;background:var(--accent-soft);color:var(--accent-dark);border:3px solid var(--accent)}
  .topic.done .num{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
  .topic h3{margin:0;font-size:18px;font-weight:900}
  .topic p{margin:2px 0 0;color:var(--muted);font-size:15px}
  .stars{font-size:18px;letter-spacing:2px;color:#D9CDB6}
  .stars .s{color:var(--gold)}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:900;box-shadow:0 4px 0 var(--accent-dark);min-height:44px}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-dark)}
  .btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
  .btn.ok{background:var(--ok);box-shadow:0 4px 0 #1F7442}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* Practice */
  .practice{max-width:720px;margin:0 auto}
  .phead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .dots{display:flex;gap:6px;flex:1}
  .dots i{flex:1;height:10px;border-radius:99px;background:var(--line)}
  .dots i.cur{background:var(--teal)}
  .dots i.ok{background:var(--ok)}
  .dots i.bad{background:var(--bad)}
  .qcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:28px}
  .qlabel{font-size:13px;font-weight:900;color:var(--teal);text-transform:uppercase;letter-spacing:.8px}
  .qtext{font-size:26px;font-weight:800;margin:10px 0 22px;line-height:1.45}
  .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 3px;font-weight:900}
  .frac span:first-child{border-bottom:3px solid currentColor;padding:0 4px}
  .frac span{padding:0 4px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .choice{border:3px solid var(--line);background:var(--card);border-radius:14px;padding:16px;font-size:24px;font-weight:900;min-height:64px}
  .choice:hover{border-color:var(--teal)}
  .choice.sel{border-color:var(--teal);background:var(--teal-soft)}
  .choice.right{border-color:var(--ok);background:var(--ok-soft)}
  .choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .ans{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .ans input{font:inherit;font-size:26px;font-weight:900;width:220px;padding:10px 16px;border:3px solid var(--line);border-radius:14px}
  .hint{color:var(--muted);font-size:14px;margin-top:8px}
  .fb{margin-top:20px;border-radius:14px;padding:16px 18px;font-weight:700;display:none}
  .fb.show{display:block}
  .fb.ok{background:var(--ok-soft);color:#17643A}
  .fb.bad{background:var(--bad-soft);color:#8E2323}
  .fb .big{font-size:20px;font-weight:900}
  .steps{margin:12px 0 0;padding:14px 18px 14px 38px;background:#fff;border-radius:12px;color:var(--ink);font-weight:600}
  .steps li{margin:4px 0}
  .linkbtn{background:none;border:0;color:inherit;text-decoration:underline;font-weight:800;padding:0;margin-top:8px}
  .pfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:12px}
  .pop{display:inline-block;font-weight:900;color:var(--accent-dark);animation:pop .6s ease}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.2);opacity:1}100%{transform:scale(1)}}

  /* Result */
  .result{text-align:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:36px 24px;max-width:560px;margin:0 auto}
  .result .stars{font-size:48px;letter-spacing:8px}
  .result .score{font-size:44px;font-weight:900;margin:8px 0}
  .newmedal{margin:16px auto 0;background:var(--accent-soft);border-radius:14px;padding:12px;font-weight:800;max-width:380px}

  /* Medals */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .item{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px;text-align:center}
  .item .em{font-size:52px;line-height:1.2}
  .item h3{margin:6px 0;font-size:16px}
  .item.locked{opacity:.45;filter:grayscale(1)}

  /* Report */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
  .sbox{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px 18px}
  .sbox .k{color:var(--muted);font-size:14px;font-weight:700}
  .sbox .v{font-size:26px;font-weight:900}
  table{width:100%;border-collapse:collapse;background:var(--card);border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px}
  th{background:var(--bg);font-weight:900}
  .acc{display:flex;align-items:center;gap:8px}
  .acc .bar{height:10px;max-width:140px}
  .acc .bar>i.lo{background:var(--bad)} .acc .bar>i.mid{background:var(--gold)} .acc .bar>i.hi{background:var(--ok)}
  .pill{font-size:12px;font-weight:900;padding:2px 8px;border-radius:99px}
  .pill.lo{background:var(--bad-soft);color:var(--bad)} .pill.hi{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:#FFF1C7;color:#8A6500}
  .note{background:var(--teal-soft);border-radius:var(--r);padding:14px 18px;margin-top:18px;font-weight:600}
  .empty{color:var(--muted);background:var(--card);border:2px dashed var(--line);border-radius:var(--r);padding:30px;text-align:center}

  .glab{font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;align-self:center;margin:0 2px 0 6px}
  .kel .chip{min-width:44px;padding:8px 12px}
  .lvtag{font-size:11px;font-weight:900;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.5px}
  .lvtag.lv1{background:var(--ok-soft);color:var(--ok)} .lvtag.lv2{background:#FFF1C7;color:#8A6500} .lvtag.lv3{background:var(--bad-soft);color:var(--bad)}
  .chip.lv1.on{background:var(--ok);border-color:var(--ok)} .chip.lv2.on{background:#C99300;border-color:#C99300} .chip.lv3.on{background:var(--bad);border-color:var(--bad)}
  .qtext.small{font-size:20px;font-weight:700}
  .choices.long{grid-template-columns:1fr}
  .choices.long .choice{font-size:18px;font-weight:700;text-align:left;min-height:52px}
  sup,sub{line-height:0}
  .kurbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .kur{display:flex;flex-direction:column;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 16px;min-height:44px}
  .kur b{font-size:16px;font-weight:900} .kur span{font-size:12px;color:var(--muted);font-weight:700}
  .kur.on{border-color:var(--teal);background:var(--teal-soft);box-shadow:0 3px 0 var(--teal)}
  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(31,42,46,.55);display:grid;place-items:center;z-index:20;padding:20px}
  .mbox{background:var(--card);border-radius:20px;padding:28px;max-width:440px;width:100%}
  .mbox input{font:inherit;font-size:20px;width:100%;padding:10px 14px;border:3px solid var(--line);border-radius:12px;margin:12px 0}
  .avapick{display:flex;gap:8px;margin-bottom:16px}
  .avapick button{font-size:28px;background:var(--bg);border:3px solid var(--line);border-radius:12px;width:56px;height:56px}
  .avapick button.on{border-color:var(--accent)}

  /* Tryout */
  .tsetup{display:grid;gap:14px}
  .tbox{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px 18px}
  .tbox h3{margin:0 0 10px;font-size:16px;font-weight:900;display:flex;gap:12px;align-items:baseline}
  .timer{font-weight:900;font-variant-numeric:tabular-nums;background:var(--ink);color:#fff;border-radius:12px;padding:6px 14px;font-size:20px;white-space:nowrap}
  .timer.warn{background:var(--bad);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.7}}
  .exam{display:grid;grid-template-columns:1fr 250px;gap:18px;align-items:start}
  .qnav{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:14px;position:sticky;top:120px}
  .qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:320px;overflow-y:auto;padding:3px}
  .qgrid button{border:2px solid var(--line);background:var(--card);border-radius:10px;height:40px;font-weight:900}
  .qgrid button.ans{background:var(--teal-soft);border-color:var(--teal);color:var(--teal)}
  .qgrid button.flag{background:#FFF1C7;border-color:#C99300;color:#8A6500}
  .qgrid button.cur{outline:3px solid var(--ink);outline-offset:1px}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;font-weight:700;color:var(--muted);margin:8px 0 10px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:2px solid var(--line);vertical-align:-2px;margin-right:4px}
  .pfoot.ex{flex-wrap:wrap}
  .grade{font-size:72px;font-weight:900;line-height:1;margin-top:8px}
  .review{display:grid;gap:12px}
  .rv{background:var(--card);border:2px solid var(--line);border-left-width:8px;border-radius:var(--r);padding:14px 18px}
  .rv.ok{border-left-color:var(--ok)} .rv.bad{border-left-color:var(--bad)} .rv.skip{border-left-color:#C9BFA9}
  .rv .rq{font-weight:700;margin:6px 0 8px}
  .rv .ra{font-size:15px}
  .rv .steps{background:var(--bg)}
  @media (max-width:820px){.exam{grid-template-columns:1fr}.qnav{position:static}}

  @media (max-width:640px){
    .topic{grid-template-columns:44px 1fr;}
    .topic .num{width:44px;height:44px;font-size:18px}
    .topic .act{grid-column:1 / -1}
    .topic .act .btn{width:100%}
    .qtext{font-size:22px}
    .choices{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

  <div class="top-in">
    <div class="brand">Ruang<b>Pintar</b><span class="tag">CONTOH</span></div>

    <div class="me"><span class="saldo" id="saldo" title="Bintang yang sudah kamu kumpulkan" hidden></span><div class="ava" id="ava"></div><span id="uname">Murid</span></div>

  </nav>
</header>
<main id="app"></main>

<script src="bank_intl_tambahan.js"></script>

<script>
/* ============ Util ============ */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a*b/gcd(a,b);
const F=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
const fmtD=(x,pl=1)=>String(parseFloat(x.toFixed(pl))).replace('.',',');
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);
const rupiah=n=>'Rp'+n.toLocaleString('id-ID');
const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const nz=x=>x===0?1:x;

/* ============ Tingkat kesulitan ============ */
let LV=2;                                   // 1 Mudah, 2 Sedang, 3 Sulit
const D=(a,b,c)=>[a,b,c][LV-1];
const story=()=>Math.random()<D(.15,.45,.75);
const LVNAME={1:'Mudah',2:'Sedang',3:'Sulit'};
const LVNAME_EN={0:'Mixed',1:'Easy',2:'Medium',3:'Hard'};
const lvName=(l,kur)=>(kur&&kur!=='merdeka'?LVNAME_EN:{...LVNAME,0:'Campuran'})[l];   // Cambridge & Singapore: bahasa Inggris

/* ============ Bantuan penulisan ============ */
const NAMA=['Rina','Budi','Siti','Dimas','Ayu','Raka','Putri','Andi','Lina','Joko','Nisa','Fajar'];
const BENDA=['apel','kelereng','pensil','buku','permen','kue','bola','stiker','jeruk','balon'];
const nm=()=>pick(NAMA), bd=()=>pick(BENDA);
const fmtN=n=>n.toLocaleString('id-ID');
const fmtZ=n=>n<0?`(−${-n})`:`${n}`;
const sgn=n=>n<0?`−${-n}`:`${n}`;
const cap=s=>s[0].toUpperCase()+s.slice(1);
const TEMPAT=['satuan','puluhan','ratusan','ribuan','puluh ribuan','ratus ribuan'];
const SVG=(inner,vb='0 0 120 90',w=180)=>`<div style="margin:10px 0"><svg viewBox="${vb}" width="${w}" style="display:block;max-width:100%">${inner}</svg></div>`;
const STY='fill="#FFE6D3" stroke="#F2701D" stroke-width="4" stroke-linejoin="round"';
/* suku aljabar: term(3,'x')='3x', term(-1,'x')='−x' ; poly([[a,'x²'],[b,'x'],[c,'']]) */
function poly(terms){let s='';for(const [c,v] of terms){if(!c)continue;const ab=Math.abs(c),body=(ab===1&&v?'':ab)+v;
  s+=s?(c<0?` − ${body}`:` + ${body}`):(c<0?`−${body}`:body)}return s||'0'}
function choicesFor(ans){
  const s=new Set([ans]);
  for(const o of shuffle([1,2,-1,-2,10,-10,3,5])){ if(s.size>=4)break; const v=ans+o; if(v>=0)s.add(v); }
  while(s.size<4)s.add(ans+s.size*4);
  return shuffle([...s]);
}
function strChoices(ans,pool){const s=new Set([ans]);for(const x of shuffle(pool.slice())){if(s.size>=4)break;s.add(x)}return shuffle([...s])}
function colAddSteps(a,b){const st=[`Susun bersusun: ${fmtN(a)} + ${fmtN(b)}.`];let A=a,B=b,c=0,i=0;
  while(A>0||B>0||c>0){const da=A%10,db=B%10,s=da+db+c;st.push(`${cap(TEMPAT[i])}: ${da} + ${db}${c?' + 1 (simpanan)':''} = ${s}${s>=10?`, tulis ${s%10}, simpan 1`:''}.`);
    c=s>=10?1:0;A=Math.floor(A/10);B=Math.floor(B/10);i++}
  st.push(`Jadi hasilnya <b>${fmtN(a+b)}</b>.`);return st}
function colSubSteps(a,b){const st=[`Susun bersusun: ${fmtN(a)} − ${fmtN(b)}.`];let A=a,B=b,p=0,i=0;
  while(A>0){let da=A%10-p,db=B%10,t='';p=0;if(da<db){da+=10;p=1;t=` (pinjam 1 dari ${TEMPAT[i+1]}, jadi ${da})`}
    if(A>=10||da-db>0||i===0)st.push(`${cap(TEMPAT[i])}: ${da} − ${db} = ${da-db}${t}.`);A=Math.floor(A/10);B=Math.floor(B/10);i++}
  st.push(`Jadi hasilnya <b>${fmtN(a-b)}</b>.`);return st}
function simpSteps(n,d,st){const g=gcd(n,d);if(g>1)st.push(n%d===0?`${F(n,d)} sama dengan <b>${n/d}</b>.`:`Sederhanakan (bagi atas dan bawah dengan ${g}): <b>${F(n/g,d/g)}</b>.`);
  else st.push(`Hasilnya <b>${F(n,d)}</b>.`);if(n>d&&n%d)st.push(`Hasilnya lebih dari 1, boleh juga ditulis sebagai pecahan campuran.`);return st}
function clockSVG(h,m){const L=(a,len)=>[60+len*Math.sin(a),60-len*Math.cos(a)];

  fpb(){const g=R(D(2,2,4),D(5,9,15)),M=D(5,8,10);let m=R(1,M),n=R(1,M);while(n===m||gcd(m,n)!==1){m=R(1,M);n=R(1,M)}const a=g*m,b=g*n;
    const fa=[],fb=[];for(let i=1;i<=a;i++)if(a%i===0)fa.push(i);for(let i=1;i<=b;i++)if(b%i===0)fb.push(i);const st=story();
    return {q:st?`Ada <b>${a}</b> apel dan <b>${b}</b> jeruk. Buah-buah itu akan dimasukkan ke keranjang tanpa sisa. Jumlah apel di setiap keranjang harus sama, begitu juga jumlah jeruknya. Paling banyak berapa keranjang yang bisa dibuat?`:`Berapa FPB dari <b>${a}</b> dan <b>${b}</b>?`,ans:g,kind:'int',
      steps:[st?`Soal ini mencari FPB dari ${a} dan ${b}.`:`FPB = faktor persekutuan terbesar.`,`Faktor ${a}: ${fa.join(', ')}.`,`Faktor ${b}: ${fb.join(', ')}.`,`Faktor yang sama dan paling besar: <b>${g}</b>.`]}},
  luas(){if(LV===3&&Math.random()<.6){const p=R(4,20),l=R(2,p-1);return {q:`Luas sebuah persegi panjang <b>${p*l} cm²</b> dan panjangnya <b>${p} cm</b>. Berapa cm lebarnya?`,ans:l,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Luas = panjang × lebar, jadi lebar = luas : panjang.`,`${p*l} : ${p} = <b>${l}</b> cm.`]}}
    if(LV===1||Math.random()<.4){const s=R(2,D(10,15,25));return {q:`Sebuah persegi memiliki sisi <b>${s} cm</b>. Berapa cm² luasnya?`,ans:s*s,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Luas persegi = sisi × sisi.`,`${s} × ${s} = <b>${s*s}</b> cm².`]}}
    const p=R(4,20),l=R(2,p-1),o=nm();const q=story()?`Kamar ${o} berbentuk persegi panjang dengan panjang <b>${p} m</b> dan lebar <b>${l} m</b>. Berapa m² luas kamar itu?`:`Sebuah persegi panjang panjangnya <b>${p} cm</b> dan lebarnya <b>${l} cm</b>. Berapa cm² luasnya?`;
    return {q,ans:p*l,kind:'int',hint:'Tulis angkanya saja.',steps:[`Luas persegi panjang = panjang × lebar.`,`${p} × ${l} = <b>${p*l}</b>.`]}},
  bulat(){const base=D(10,pick([10,100]),pick([100,1000])),[lo,hi]=D([101,999],[101,9999],[10001,99999]),n=R(lo,hi),r=Math.round(n/base)*base,dig=Math.floor(n/(base/10))%10;
    const nama={10:'puluhan',100:'ratusan',1000:'ribuan'}[base],cek={10:'satuan',100:'puluhan',1000:'ratusan'}[base];
    return {q:`Bulatkan <b>${fmtN(n)}</b> ke ${nama} terdekat.`,ans:r,kind:'int',
      steps:[`Lihat angka ${cek}: ${dig}.`,r===n?`Bilangan ini sudah merupakan kelipatan ${base}, jadi nilainya tetap.`:dig>=5?`${dig} adalah 5 atau lebih → bulatkan ke atas.`:`${dig} kurang dari 5 → bulatkan ke bawah.`,`Hasilnya <b>${fmtN(r)}</b>.`]}},

  /* ---------- Kelas 5 ---------- */
  faddDiff(){const M=D(4,6,10);let b=R(2,M),d=R(2,M);while(d===b)d=R(2,M);const a=R(1,b-1),c=R(1,d-1),L=lcm(b,d),na=a*L/b,nc=c*L/d,s=na+nc;
    return {q:`${F(a,b)} + ${F(c,d)} = ?`,ans:[s,L],kind:'frac',hint:'Tulis pecahan seperti 7/6 atau 1 1/6.',
      steps:simpSteps(s,L,[`Samakan penyebut dulu. KPK dari ${b} dan ${d} adalah ${L}.`,`${F(a,b)} = ${F(na,L)} dan ${F(c,d)} = ${F(nc,L)}.`,`Jumlahkan pembilang: ${na} + ${nc} = ${s}, jadi ${F(s,L)}.`])}},
  fsubDiff(){const M=D(4,8,12);let a,b,c,d;do{b=R(2,M);d=R(2,M);a=R(1,b-1);c=R(1,d-1)}while(b===d||a*d<=c*b);const L=lcm(b,d),na=a*L/b,nc=c*L/d,s=na-nc;
    return {q:`${F(a,b)} − ${F(c,d)} = ?`,ans:[s,L],kind:'frac',hint:'Tulis pecahan seperti 1/6.',
      steps:simpSteps(s,L,[`Samakan penyebut dulu. KPK dari ${b} dan ${d} adalah ${L}.`,`${F(a,b)} = ${F(na,L)} dan ${F(c,d)} = ${F(nc,L)}.`,`Kurangkan pembilang: ${na} − ${nc} = ${s}, jadi ${F(s,L)}.`])}},
  fmul(){if(LV===3&&Math.random()<.5){const b=R(2,9),a=R(1,b-1),k=b*R(1,6),o=nm();return {q:`${o} punya <b>${k}</b> kelereng. Sebanyak ${F(a,b)} bagian diberikan ke adiknya. Berapa kelereng yang diberikan?`,ans:k*a/b,kind:'int',
      steps:[`Hitung ${F(a,b)} × ${k}.`,`${k} : ${b} = ${k/b}, lalu ${k/b} × ${a} = <b>${k*a/b}</b>.`]}}
    const M=D(5,9,12),b=R(2,M),d=R(2,M),a=R(1,b-1),c=R(1,d-1);
    return {q:`${F(a,b)} × ${F(c,d)} = ?`,ans:[a*c,b*d],kind:'frac',hint:'Tulis pecahan seperti 2/15.',
      steps:simpSteps(a*c,b*d,[`Kalikan pembilang dengan pembilang: ${a} × ${c} = ${a*c}.`,`Kalikan penyebut dengan penyebut: ${b} × ${d} = ${b*d}.`,`Didapat ${F(a*c,b*d)}.`])}},
  dec(){const pl=D(1,1,2),sc=10**pl,plus=Math.random()<D(1,.6,.5),hi=D(99,99,999);let ai=R(1,hi),bi=R(1,hi);if(!plus){ai=R(Math.floor(hi/5),hi);bi=R(1,ai-1)}
    const r=plus?ai+bi:ai-bi,c=r/sc;
    return {q:`${fmtD(ai/sc,pl)} ${plus?'+':'−'} ${fmtD(bi/sc,pl)} = ?`,ans:c,kind:'dec',hint:'Boleh pakai koma, contoh 4,7.',
      steps:[`Susun kedua bilangan dengan koma sejajar.`,`Hitung seperti bilangan biasa (dalam ${pl===1?'persepuluhan':'perseratusan'}): ${ai} ${plus?'+':'−'} ${bi} = ${r}.`,`Beri koma ${pl} angka dari kanan: <b>${fmtD(c,pl)}</b>.`]}},
  pecPersen(){if(LV===3){if(Math.random()<.5){const p=pick([5,15,24,35,45,60,75,80]),g=gcd(p,100);return {q:`Ubah ke bentuk pecahan paling sederhana: &nbsp;${p}% = ?`,ans:[p/g,100/g],kind:'frac',simplest:true,hint:'Tulis pecahan seperti 3/4.',
        steps:[`${p}% = ${F(p,100)}.`,`Sederhanakan (bagi dengan ${g}): <b>${F(p/g,100/g)}</b>.`]}}
      const p=pick([5,12,25,40,65,75,8,95]);return {q:`Ubah ke bentuk persen: &nbsp;${fmtD(p/100,2)} = ... %`,ans:p,kind:'int',hint:'Tulis angkanya saja.',
        steps:[`Untuk mengubah desimal ke persen, kalikan dengan 100.`,`${fmtD(p/100,2)} × 100 = <b>${p}%</b>.`]}}
    const d=pick(D([2,4,10],[2,4,5,10,20,25],[4,5,20,25,50])),n=R(1,d-1),k=100/d;
    return {q:`Ubah ke bentuk persen: &nbsp;${F(n,d)} = ... %`,ans:n*k,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Persen artinya per 100. Ubah penyebut ${d} menjadi 100 dengan dikali ${k}.`,`${F(n,d)} = ${F(n+' × '+k,d+' × '+k)} = ${F(n*k,100)}.`,`Jadi <b>${n*k}%</b>.`]}},
  kecepatan(){const kend=pick(['mobil','bus','motor','kereta']);
    if(LV===3&&Math.random()<.6){let v,mn;do{v=pick([40,48,60,72,80,90,120]);mn=pick([15,20,30,45,90,150])}while((v*mn)%60);const s=v*mn/60;
      return {q:`Sebuah ${kend} melaju dengan kecepatan <b>${v} km/jam</b> selama <b>${mn} menit</b>. Berapa km jarak yang ditempuh?`,ans:s,kind:'int',hint:'Tulis angkanya saja.',
        steps:[`Ubah waktu ke jam: ${mn} menit = ${F(mn,60)} jam.`,`Jarak = kecepatan × waktu = ${v} × ${F(mn,60)} = <b>${s}</b> km.`]}}
    const v=R(3,12)*10,t=R(1,5),s=v*t,w=LV===1?0:R(0,2);
    if(w===0)return {q:`Sebuah ${kend} melaju dengan kecepatan <b>${v} km/jam</b> selama <b>${t} jam</b>. Berapa km jarak yang ditempuh?`,ans:s,kind:'int',hint:'Tulis angkanya saja.',steps:[`Jarak = kecepatan × waktu.`,`${v} × ${t} = <b>${s}</b> km.`]};
    if(w===1)return {q:`Jarak kota A ke kota B <b>${s} km</b>. Sebuah ${kend} melaju <b>${v} km/jam</b>. Berapa jam waktu yang dibutuhkan?`,ans:t,kind:'int',hint:'Tulis angkanya saja.',steps:[`Waktu = jarak : kecepatan.`,`${s} : ${v} = <b>${t}</b> jam.`]};
    return {q:`Sebuah ${kend} menempuh jarak <b>${s} km</b> dalam <b>${t} jam</b>. Berapa km/jam kecepatannya?`,ans:v,kind:'int',hint:'Tulis angkanya saja.',steps:[`Kecepatan = jarak : waktu.`,`${s} : ${t} = <b>${v}</b> km/jam.`]}},
  volume(){if(LV===3){if(Math.random()<.5){const s=R(2,12);return {q:`Volume sebuah kubus <b>${s**3} cm³</b>. Berapa cm panjang rusuknya?`,ans:s,kind:'int',hint:'Tulis angkanya saja.',steps:[`Volume kubus = s × s × s. Cari bilangan yang dipangkatkan tiga hasilnya ${s**3}.`,`${s} × ${s} × ${s} = ${s**3}, jadi rusuknya <b>${s}</b> cm.`]}}
      const p=R(3,15),l=R(2,10),t=R(2,12);return {q:`Volume sebuah balok <b>${p*l*t} cm³</b>, panjangnya <b>${p} cm</b> dan lebarnya <b>${l} cm</b>. Berapa cm tingginya?`,ans:t,kind:'int',hint:'Tulis angkanya saja.',
        steps:[`Volume = p × l × t, jadi t = volume : (p × l).`,`p × l = ${p*l}.`,`${p*l*t} : ${p*l} = <b>${t}</b> cm.`]}}
    if(LV===1||Math.random()<.45){const s=R(2,D(6,12,12));return {q:`Sebuah kubus memiliki rusuk <b>${s} cm</b>. Berapa cm³ volumenya?`,ans:s**3,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Volume kubus = rusuk × rusuk × rusuk.`,`${s} × ${s} × ${s} = <b>${s**3}</b> cm³.`]}}
    const p=R(3,15),l=R(2,10),t=R(2,10);return {q:`Sebuah balok berukuran panjang <b>${p} cm</b>, lebar <b>${l} cm</b>, dan tinggi <b>${t} cm</b>. Berapa cm³ volumenya?`,ans:p*l*t,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Volume balok = panjang × lebar × tinggi.`,`${p} × ${l} × ${t} = ${p*l} × ${t} = <b>${p*l*t}</b> cm³.`]}},

  /* ---------- Kelas 6 ---------- */
  pct(){const p=pick(D([10,50],[10,20,25,50,75],[5,15,30,35,40,60])),y=R(1,20)*20;
    if(story()){const harga=y*1000,pot=p*y*10,tanya=LV>1&&Math.random()<.5;
      return {q:`Harga sebuah ${pick(['buku','tas','sepatu','mainan'])} ${rupiah(harga)}. Ada diskon <b>${p}%</b>. ${tanya?'Berapa rupiah harga yang harus dibayar?':'Berapa rupiah potongan harganya?'}`,ans:tanya?harga-pot:pot,kind:'int',hint:'Tulis angkanya saja, contoh 15000.',
        steps:[`${p}% artinya ${F(p,100)}.`,`Potongan = ${F(p,100)} × ${fmtN(harga)} = ${fmtN(pot)}.`,tanya?`Harga bayar = ${fmtN(harga)} − ${fmtN(pot)} = <b>${rupiah(harga-pot)}</b>.`:`Jadi potongannya <b>${rupiah(pot)}</b>.`]}}
    const ans=p*y/100;
    return {q:`${p}% dari ${y} = ?`,ans,kind:'int',steps:[`${p}% artinya ${F(p,100)}.`,`${F(p,100)} × ${y} = ${p*y} : 100 = <b>${ans}</b>.`]}},
  mix(){const a=R(2,20),b=R(2,9),c=R(2,9),v=LV===1?R(0,1):LV===2?R(0,3):R(2,4);
    if(v===0)return {q:`${a} + ${b} × ${c} = ?`,ans:a+b*c,kind:'int',steps:[`Kerjakan perkalian dulu: ${b} × ${c} = ${b*c}.`,`Lalu penjumlahan: ${a} + ${b*c} = <b>${a+b*c}</b>.`]};
    if(v===1)return {q:`(${a} + ${b}) × ${c} = ?`,ans:(a+b)*c,kind:'int',steps:[`Kerjakan yang di dalam kurung dulu: ${a} + ${b} = ${a+b}.`,`Lalu perkalian: ${a+b} × ${c} = <b>${(a+b)*c}</b>.`]};
    if(v===2){const q=R(2,9),x=b*q;return {q:`${a} + ${x} : ${b} = ?`,ans:a+q,kind:'int',steps:[`Kerjakan pembagian dulu: ${x} : ${b} = ${q}.`,`Lalu penjumlahan: ${a} + ${q} = <b>${a+q}</b>.`]}}
    if(v===3){const m=R(1,b*c);return {q:`${b} × ${c} − ${m} = ?`,ans:b*c-m,kind:'int',steps:[`Kerjakan perkalian dulu: ${b} × ${c} = ${b*c}.`,`Lalu pengurangan: ${b*c} − ${m} = <b>${b*c-m}</b>.`]}}
    const e=R(2,9),q=R(2,9),d=e*q,ans=a+b*c-q;
    return {q:`${a} + ${b} × ${c} − ${d} : ${e} = ?`,ans,kind:'int',steps:[`Kerjakan perkalian dan pembagian dulu: ${b} × ${c} = ${b*c} dan ${d} : ${e} = ${q}.`,`Lalu dari kiri ke kanan: ${a} + ${b*c} − ${q} = <b>${ans}</b>.`]}},
  bilBulat(){const M=D(10,15,30);
    if(LV===3&&Math.random()<.4){const a=nz(R(-12,12)),b=nz(R(-12,12));return {q:`${fmtZ(a)} × ${fmtZ(b)} = ?`,ans:a*b,kind:'int',hint:'Pakai tanda minus (-) untuk bilangan negatif.',
      steps:[`Aturan tanda: positif × positif = positif, negatif × negatif = positif, positif × negatif = negatif.`,`${Math.abs(a)} × ${Math.abs(b)} = ${Math.abs(a*b)}, tandanya ${a*b<0?'negatif':'positif'}.`,`Hasilnya <b>${a*b}</b>.`]}}
    const a=R(-M,M),b=R(-M,M),plus=Math.random()<.5,ans=plus?a+b:a-b;
    if(story()){const t1=R(-10,5),naik=R(3,15);return {q:`Suhu pagi hari di puncak gunung <b>${t1}°C</b>. Siang hari suhu naik <b>${naik}°C</b>. Berapa °C suhu siang hari?`,ans:t1+naik,kind:'int',hint:'Pakai tanda minus (-) untuk bilangan negatif.',
      steps:[`Suhu naik berarti ditambah: ${fmtZ(t1)} + ${naik}.`,`Dari ${t1} maju ${naik} langkah di garis bilangan = <b>${t1+naik}</b>°C.`]}}
    const st=[];if(!plus&&b<0)st.push(`Mengurangi bilangan negatif sama dengan menambah lawannya: ${fmtZ(a)} − ${fmtZ(b)} = ${fmtZ(a)} + ${-b}.`);
    else if(plus&&b<0)st.push(`Menambah bilangan negatif sama dengan mengurangi: ${fmtZ(a)} + ${fmtZ(b)} = ${fmtZ(a)} − ${-b}.`);
    else st.push(`Gunakan garis bilangan: mulai dari ${a}, lalu ${plus?'maju':'mundur'} ${Math.abs(b)} langkah.`);
    st.push(`Hasilnya <b>${ans}</b>.`);
    return {q:`${fmtZ(a)} ${plus?'+':'−'} ${fmtZ(b)} = ?`,ans,kind:'int',hint:'Pakai tanda minus (-) untuk bilangan negatif.',steps:st}},
  lingkaran(){const r=pick(D([7,14],[7,14,21],[14,21,28,35])),pakaiD=Math.random()<D(0,.4,.6),luas=LV===1?false:Math.random()<.5;const ukuran=pakaiD?`diameter <b>${2*r} cm</b>`:`jari-jari <b>${r} cm</b>`;
    const st=pakaiD?[`Jari-jari = diameter : 2 = ${2*r} : 2 = ${r} cm.`]:[];
    if(luas){st.push(`Luas lingkaran = ${F(22,7)} × r × r.`,`${F(22,7)} × ${r} × ${r} = 22 × ${r/7} × ${r} = <b>${22*r*r/7}</b> cm².`);
      return {q:`Sebuah lingkaran memiliki ${ukuran}. Berapa cm² luasnya? (π = ${F(22,7)})`,ans:22*r*r/7,kind:'int',hint:'Tulis angkanya saja.',steps:st}}
    st.push(`Keliling lingkaran = 2 × ${F(22,7)} × r.`,`2 × ${F(22,7)} × ${r} = 2 × 22 × ${r/7} = <b>${44*r/7}</b> cm.`);
    return {q:`Sebuah lingkaran memiliki ${ukuran}. Berapa cm kelilingnya? (π = ${F(22,7)})`,ans:44*r/7,kind:'int',hint:'Tulis angkanya saja.',steps:st}},
  rata(){let n,vals,m;do{n=D(3,4,R(5,6));m=R(50,95);vals=[];for(let i=0;i<n-1;i++)vals.push(Math.min(100,Math.max(0,m+R(-15,15))));vals.push(m*n-vals.reduce((a,b)=>a+b,0))}while(vals[n-1]<0||vals[n-1]>100);
    const s=m*n,o=nm();
    if(LV===3&&Math.random()<.5){const known=vals.slice(0,-1),miss=vals[n-1],ks=known.reduce((a,b)=>a+b,0);
      return {q:`Rata-rata nilai ${n} ulangan ${o} adalah <b>${m}</b>. Nilai ${n-1} ulangan pertama: <b>${known.join(', ')}</b>. Berapa nilai ulangan terakhir?`,ans:miss,kind:'int',
        steps:[`Jumlah semua nilai = rata-rata × banyak data = ${m} × ${n} = ${s}.`,`Jumlah ${n-1} nilai pertama = ${ks}.`,`Nilai terakhir = ${s} − ${ks} = <b>${miss}</b>.`]}}
    return {q:`Nilai ulangan ${o}: <b>${vals.join(', ')}</b>. Berapa rata-ratanya?`,ans:m,kind:'int',
      steps:[`Rata-rata = jumlah semua nilai : banyak data.`,`Jumlah: ${vals.join(' + ')} = ${s}.`,`${s} : ${n} = <b>${m}</b>.`]}},
  pangkat(){const v=LV===1?R(0,1):LV===2?R(0,2):R(1,3);
    if(v===0){const a=R(2,D(10,20,20));return {q:`${a}² = ?`,ans:a*a,kind:'int',steps:[`${a}² artinya ${a} × ${a}.`,`${a} × ${a} = <b>${a*a}</b>.`]}}
    if(v===1){const a=R(2,D(10,20,25));return {q:`√${a*a} = ?`,ans:a,kind:'int',steps:[`Cari bilangan yang jika dikuadratkan hasilnya ${a*a}.`,`${a} × ${a} = ${a*a}, jadi √${a*a} = <b>${a}</b>.`]}}
    if(v===2){const a=R(2,10);return {q:`${a}³ = ?`,ans:a**3,kind:'int',steps:[`${a}³ artinya ${a} × ${a} × ${a}.`,`${a} × ${a} = ${a*a}, lalu ${a*a} × ${a} = <b>${a**3}</b>.`]}}
    const a=R(2,12),b=R(2,15);return {q:`${a}² + √${b*b} = ?`,ans:a*a+b,kind:'int',steps:[`${a}² = ${a*a}.`,`√${b*b} = ${b}.`,`${a*a} + ${b} = <b>${a*a+b}</b>.`]}},
  perbandingan(){let a=R(1,6),b=R(1,6);while(a===b||gcd(a,b)!==1){a=R(1,6);b=R(1,6)}const k=R(2,9),o1=nm();let o2=nm();while(o2===o1)o2=nm();const x=bd(),tanyaB=Math.random()<.5,T=tanyaB?b:a,W=tanyaB?o2:o1;
    if(LV===1)return {q:`Perbandingan ${x} ${o1} dan ${o2} adalah <b>${a} : ${b}</b>. Jika ${x} ${o1} ada <b>${a*k}</b>, berapa ${x} ${o2}?`,ans:b*k,kind:'int',
      steps:[`${a*k} : ${a} = ${k}, artinya setiap 1 bagian = ${k}.`,`${x} ${o2} = ${b} × ${k} = <b>${b*k}</b>.`]};
    if(LV===3){const sel=Math.abs(a-b)*k;return {q:`Perbandingan ${x} ${o1} dan ${o2} adalah <b>${a} : ${b}</b>. Selisih ${x} mereka <b>${sel}</b>. Berapa ${x} milik ${W}?`,ans:T*k,kind:'int',
      steps:[`Selisih bagian perbandingan: ${Math.max(a,b)} − ${Math.min(a,b)} = ${Math.abs(a-b)}.`,`1 bagian = ${sel} : ${Math.abs(a-b)} = ${k}.`,`Milik ${W} = ${T} × ${k} = <b>${T*k}</b>.`]}}
    const tot=(a+b)*k;
    return {q:`Perbandingan ${x} ${o1} dan ${o2} adalah <b>${a} : ${b}</b>. Jumlah ${x} mereka <b>${tot}</b>. Berapa ${x} milik ${W}?`,ans:T*k,kind:'int',
      steps:[`Jumlah bagian perbandingan: ${a} + ${b} = ${a+b}.`,`Milik ${W} = ${F(T,a+b)} × ${tot}.`,`${tot} : ${a+b} = ${k}, lalu ${k} × ${T} = <b>${T*k}</b>.`]}},

  /* ---------- Kelas 7 (SMP) ---------- */
  kaliBulat(){const M=D(10,12,20),b=nz(R(-M,M)),q=nz(R(-M,M));
    if(LV===3&&Math.random()<.5){const c=nz(R(-5,5)),p=b*q*c;return {q:`${fmtZ(b)} × ${fmtZ(q)} × ${fmtZ(c)} = ?`,ans:p,kind:'int',hint:'Pakai tanda minus (-) untuk bilangan negatif.',
      steps:[`${fmtZ(b)} × ${fmtZ(q)} = ${b*q}.`,`${fmtZ(b*q)} × ${fmtZ(c)} = <b>${p}</b>.`,`Ingat: banyaknya tanda negatif ganjil → hasil negatif, genap → positif.`]}}
    if(Math.random()<.5)return {q:`${fmtZ(b)} × ${fmtZ(q)} = ?`,ans:b*q,kind:'int',hint:'Pakai tanda minus (-) untuk bilangan negatif.',
      steps:[`${Math.abs(b)} × ${Math.abs(q)} = ${Math.abs(b*q)}.`,`Tanda: ${(b<0)===(q<0)?'sama → positif':'berbeda → negatif'}.`,`Hasilnya <b>${b*q}</b>.`]};
    const a=b*q;return {q:`${fmtZ(a)} : ${fmtZ(b)} = ?`,ans:q,kind:'int',hint:'Pakai tanda minus (-) untuk bilangan negatif.',
      steps:[`${Math.abs(a)} : ${Math.abs(b)} = ${Math.abs(q)}.`,`Tanda: ${(a<0)===(b<0)?'sama → positif':'berbeda → negatif'}.`,`Hasilnya <b>${q}</b>.`]}},
  plsv(){const x=R(D(1,-5,-15),D(10,15,20)),a=R(2,D(3,6,9));
    if(LV===3){let c=R(1,8);while(c===a)c=R(1,8);const b=R(-15,15),d=a*x+b-c*x;
      return {q:`Tentukan nilai x dari persamaan:<br>${poly([[a,'x'],[b,'']])} = ${poly([[c,'x'],[d,'']])}`,ans:x,kind:'int',hint:'Tulis angkanya saja, boleh negatif.',
        steps:[`Kumpulkan suku x di kiri dan konstanta di kanan: ${poly([[a,'x'],[-c,'x']])} = ${sgn(d)} ${b>=0?'−':'+'} ${Math.abs(b)}.`,`${poly([[a-c,'x']])} = ${d-b}.`,`x = ${d-b} : ${fmtZ(a-c)} = <b>${x}</b>.`]}}
    const b=nz(R(-20,20)),c=a*x+b;
    return {q:`Tentukan nilai x dari persamaan:<br>${poly([[a,'x'],[b,'']])} = ${c}`,ans:x,kind:'int',hint:'Tulis angkanya saja, boleh negatif.',
      steps:[`Pindahkan ${sgn(b)} ke ruas kanan: ${a}x = ${c} ${b>0?'−':'+'} ${Math.abs(b)} = ${c-b}.`,`x = ${c-b} : ${a} = <b>${x}</b>.`]}},
  aritSosial(){const beli=R(5,50)*10000;
    if(LV===3){const p=pick([5,10,15,20,25,40]),un=beli*p/100,jual=beli+un;return {q:`Pedagang membeli barang seharga ${rupiah(beli)} dan menjualnya ${rupiah(jual)}. Berapa persen keuntungannya?`,ans:p,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Untung = ${fmtN(jual)} − ${fmtN(beli)} = ${fmtN(un)}.`,`Persentase untung = untung : harga beli × 100%.`,`${fmtN(un)} : ${fmtN(beli)} × 100% = <b>${p}%</b>.`]}}
    const d=R(1,9)*1000*(LV===1||Math.random()<.6?1:-1),jual=beli+d;
    return {q:`Pedagang membeli barang seharga ${rupiah(beli)} dan menjualnya ${rupiah(jual)}. Berapa rupiah ${d>0?'keuntungannya':'kerugiannya'}?`,ans:Math.abs(d),kind:'int',hint:'Tulis angkanya saja, contoh 5000.',
      steps:[d>0?`Harga jual lebih besar dari harga beli → untung.`:`Harga jual lebih kecil dari harga beli → rugi.`,`${d>0?'Untung = jual − beli':'Rugi = beli − jual'} = <b>${rupiah(Math.abs(d))}</b>.`]}},
  sudut(){const v=LV===1?R(0,1):LV===2?R(0,2):R(2,3),x=R(10,80);
    if(v===0)return {q:`Berapa derajat penyiku (komplemen) dari sudut ${x}°?`,ans:90-x,kind:'int',steps:[`Dua sudut saling berpenyiku jika jumlahnya 90°.`,`90° − ${x}° = <b>${90-x}°</b>.`]};
    if(v===1){const y=R(20,160);return {q:`Berapa derajat pelurus (suplemen) dari sudut ${y}°?`,ans:180-y,kind:'int',steps:[`Dua sudut saling berpelurus jika jumlahnya 180°.`,`180° − ${y}° = <b>${180-y}°</b>.`]}}
    if(v===2){const a=R(30,80),b=R(30,80);return {q:`Dua sudut sebuah segitiga besarnya ${a}° dan ${b}°. Berapa derajat sudut ketiga?`,ans:180-a-b,kind:'int',steps:[`Jumlah sudut dalam segitiga = 180°.`,`180° − ${a}° − ${b}° = <b>${180-a-b}°</b>.`]}}
    const k=R(2,4),c=R(5,30),xx=R(10,Math.min(40,Math.floor((179-c)/k))),ang=k*xx+c;return {q:`Sudut pertama besarnya (${k}x + ${c})° dan sudut kedua yang bertolak belakang dengannya besarnya ${ang}°. Berapa nilai x?`,ans:xx,kind:'int',
      steps:[`Sudut bertolak belakang besarnya sama: ${k}x + ${c} = ${ang}.`,`${k}x = ${ang-c}.`,`x = <b>${xx}</b>.`]}},
  himpunan(){const nA=R(10,30),nB=R(10,30),nAB=R(2,Math.min(nA,nB)-2),u=nA+nB-nAB,kls=pick(['siswa','anak']);
    if(LV===3){const lain=R(1,10),S=u+lain;return {q:`Dari <b>${S}</b> ${kls}, <b>${nA}</b> suka matematika, <b>${nB}</b> suka IPA, dan <b>${nAB}</b> suka keduanya. Berapa ${kls} yang tidak suka matematika maupun IPA?`,ans:lain,kind:'int',
      steps:[`Yang suka minimal salah satu: n(A ∪ B) = ${nA} + ${nB} − ${nAB} = ${u}.`,`Tidak suka satu pun = ${S} − ${u} = <b>${lain}</b>.`]}}
    return {q:LV===1?`Diketahui n(A) = ${nA}, n(B) = ${nB}, dan n(A ∩ B) = ${nAB}. Berapa n(A ∪ B)?`:`Di kelas, <b>${nA}</b> ${kls} suka voli, <b>${nB}</b> suka futsal, dan <b>${nAB}</b> suka keduanya. Berapa ${kls} yang suka voli atau futsal?`,ans:u,kind:'int',
      steps:[`n(A ∪ B) = n(A) + n(B) − n(A ∩ B).`,`${nA} + ${nB} − ${nAB} = <b>${u}</b>.`]}},
  perbSenilai(){if(Math.random()<.5){const n1=R(2,6),hs=R(2,15)*1000,n2=R(n1+1,12);return {q:`Harga <b>${n1}</b> buku adalah ${rupiah(n1*hs)}. Berapa rupiah harga <b>${n2}</b> buku?`,ans:n2*hs,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Ini perbandingan senilai (makin banyak buku, makin mahal).`,`Harga 1 buku = ${fmtN(n1*hs)} : ${n1} = ${fmtN(hs)}.`,`Harga ${n2} buku = ${n2} × ${fmtN(hs)} = <b>${rupiah(n2*hs)}</b>.`]}}
    let p1,d1,p2;do{p1=R(3,12);d1=R(4,20);p2=R(2,15)}while(p2===p1||(p1*d1)%p2);const d2=p1*d1/p2;
    return {q:`Sebuah pekerjaan selesai dalam <b>${d1} hari</b> oleh <b>${p1} pekerja</b>. Jika dikerjakan <b>${p2} pekerja</b>, berapa hari pekerjaan itu selesai?`,ans:d2,kind:'int',
      steps:[`Ini perbandingan berbalik nilai (makin banyak pekerja, makin cepat).`,`${p1} × ${d1} = ${p1*d1} hari-pekerja.`,`${p1*d1} : ${p2} = <b>${d2}</b> hari.`]}},

  /* ---------- Kelas 8 ---------- */
  polaN(){const a=R(1,20),b=nz(R(D(2,-5,-9),D(5,9,12))),n=R(D(5,10,15),D(10,25,60));
    if(LV===3&&Math.random()<.5){const i=R(2,4),j=R(i+2,9),Ui=a+(i-1)*b,Uj=a+(j-1)*b;return {q:`Suku ke-${i} barisan aritmetika adalah ${Ui} dan suku ke-${j} adalah ${Uj}. Berapa suku ke-${n}?`,ans:a+(n-1)*b,kind:'int',
      steps:[`Beda: b = (${Uj} − ${fmtZ(Ui)}) : (${j} − ${i}) = ${b}.`,`Suku pertama: a = ${Ui} − ${i-1} × ${fmtZ(b)} = ${a}.`,`U${n} = a + (n − 1)b = ${a} + ${n-1} × ${fmtZ(b)} = <b>${a+(n-1)*b}</b>.`]}}
    const seq=[0,1,2,3].map(i=>a+i*b);
    return {q:`Diketahui barisan aritmetika: ${seq.join(', ')}, … Berapa suku ke-${n}?`,ans:a+(n-1)*b,kind:'int',
      steps:[`Suku pertama a = ${a}, beda b = ${b}.`,`Rumus: U<sub>n</sub> = a + (n − 1)b.`,`U${n} = ${a} + ${n-1} × ${fmtZ(b)} = <b>${a+(n-1)*b}</b>.`]}},
  gradien(){let x1,y1,x2,y2;
    if(LV===1){const m=nz(R(-4,4)),dx=R(1,4);x1=R(-5,5);y1=R(-5,5);x2=x1+dx;y2=y1+m*dx}else{do{x1=R(-6,6);y1=R(-6,6);x2=R(-6,6);y2=R(-6,6)}while(x2===x1||y2===y1)}
    let n=y2-y1,d=x2-x1;if(d<0){n=-n;d=-d}const g=gcd(n,d);
    return {q:`Berapa gradien garis yang melalui titik (${x1}, ${y1}) dan (${x2}, ${y2})?`,ans:[n,d],kind:'frac',hint:'Bisa bilangan bulat atau pecahan, contoh -3/2.',
      steps:[`m = (y₂ − y₁) : (x₂ − x₁).`,`m = (${y2} − ${fmtZ(y1)}) : (${x2} − ${fmtZ(x1)}) = ${y2-y1} : ${x2-x1}.`,`Jadi m = <b>${d/g===1?n/g:(n<0?'−':'')+Math.abs(n/g)+'/'+d/g}</b>.`]}},
  spldv(){const x=R(-5,10),y=R(-5,10);
    if(LV===1){const s=x+y,d=x-y;return {q:`Diketahui x + y = ${s} dan x − y = ${d}. Berapa nilai x?`,ans:x,kind:'int',hint:'Boleh negatif.',
      steps:[`Jumlahkan kedua persamaan: 2x = ${s} + ${fmtZ(d)} = ${s+d}.`,`x = ${s+d} : 2 = <b>${x}</b>.`]}}
    let a1,b1,a2,b2;do{a1=R(1,5);b1=nz(R(-5,5));a2=R(1,5);b2=nz(R(-5,5))}while(a1*b2-a2*b1===0);const c1=a1*x+b1*y,c2=a2*x+b2*y,askX=Math.random()<.5;
    const m1=askX?b2:a2,m2=askX?b1:a1;
    const koef=askX?a1*m1-a2*m2:b1*m1-b2*m2,hasil=c1*m1-c2*m2;
    const variabel=askX?'x':'y';
    return {q:`Diketahui:<br>${poly([[a1,'x'],[b1,'y']])} = ${c1}<br>${poly([[a2,'x'],[b2,'y']])} = ${c2}<br>Berapa nilai ${askX?'x':'y'}?`,ans:askX?x:y,kind:'int',hint:'Boleh negatif.',
      steps:[`Kalikan persamaan pertama dengan ${m1} dan kedua dengan ${m2} agar koefisien ${askX?'y':'x'} sama.`,`Kurangkan persamaan kedua dari persamaan pertama setelah dikalikan: ${koef}${variabel} = ${c1*m1} − (${c2*m2}) = ${hasil}.`,`Bagi kedua ruas dengan ${koef}: ${variabel} = <b>${askX?x:y}</b>.`]}},
  pythagoras(){const T=pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],[9,12,15]]),k=R(1,D(1,3,5)),[a,b,c]=T.map(v=>v*k);
    if(LV===1||Math.random()<.4)return {q:`Segitiga siku-siku memiliki sisi tegak <b>${a} cm</b> dan <b>${b} cm</b>. Berapa cm panjang sisi miringnya?`,ans:c,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`c² = a² + b² = ${a*a} + ${b*b} = ${c*c}.`,`c = √${c*c} = <b>${c}</b> cm.`]};
    if(LV===3)return {q:`Sebuah tangga sepanjang <b>${c} m</b> disandarkan ke tembok. Jarak kaki tangga ke tembok <b>${a} m</b>. Berapa m tinggi tembok yang dicapai tangga?`,ans:b,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Tangga = sisi miring. Tinggi² = ${c}² − ${a}² = ${c*c} − ${a*a} = ${b*b}.`,`Tinggi = √${b*b} = <b>${b}</b> m.`]};
    return {q:`Sisi miring segitiga siku-siku <b>${c} cm</b> dan salah satu sisi tegaknya <b>${a} cm</b>. Berapa cm sisi tegak yang lain?`,ans:b,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`b² = c² − a² = ${c*c} − ${a*a} = ${b*b}.`,`b = √${b*b} = <b>${b}</b> cm.`]}},
  lpBangun(){if(LV===3&&Math.random()<.5){const s=R(2,15);return {q:`Luas permukaan sebuah kubus <b>${6*s*s} cm²</b>. Berapa cm panjang rusuknya?`,ans:s,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Luas permukaan kubus = 6 × s².`,`s² = ${6*s*s} : 6 = ${s*s}.`,`s = √${s*s} = <b>${s}</b> cm.`]}}
    if(LV===1||Math.random()<.4){const s=R(2,D(8,12,15));return {q:`Berapa cm² luas permukaan kubus dengan rusuk <b>${s} cm</b>?`,ans:6*s*s,kind:'int',hint:'Tulis angkanya saja.',steps:[`Luas permukaan kubus = 6 × s × s.`,`6 × ${s} × ${s} = <b>${6*s*s}</b> cm².`]}}
    const p=R(3,15),l=R(2,10),t=R(2,10),L=2*(p*l+p*t+l*t);return {q:`Berapa cm² luas permukaan balok berukuran ${p} cm × ${l} cm × ${t} cm?`,ans:L,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Luas permukaan balok = 2 × (pl + pt + lt).`,`= 2 × (${p*l} + ${p*t} + ${l*t}) = 2 × ${p*l+p*t+l*t} = <b>${L}</b> cm².`]}},
  statistik(){const v=pick(D(['mean','modus'],['mean','median','modus'],['median','mean','modus'])),n=pick(D([5],[5,7],[7,9]));let data;
    if(v==='mean'){let m;do{m=R(5,9);data=[];for(let i=0;i<n-1;i++)data.push(R(m-3,m+3));data.push(m*n-data.reduce((a,b)=>a+b,0))}while(data[n-1]<1||data[n-1]>10);
      return {q:`Data nilai: <b>${data.join(', ')}</b>. Berapa rata-ratanya (mean)?`,ans:m,kind:'int',steps:[`Jumlah data = ${data.join(' + ')} = ${m*n}.`,`Mean = ${m*n} : ${n} = <b>${m}</b>.`]}}
    if(v==='median'){data=[];for(let i=0;i<n;i++)data.push(R(1,10));const s=data.slice().sort((a,b)=>a-b),md=s[(n-1)/2];
      return {q:`Data nilai: <b>${data.join(', ')}</b>. Berapa mediannya?`,ans:md,kind:'int',steps:[`Urutkan data: ${s.join(', ')}.`,`Data ke-${(n+1)/2} (paling tengah) adalah <b>${md}</b>.`]}}
    const mo=R(1,10),others=shuffle([...Array(10).keys()].map(i=>i+1).filter(x=>x!==mo)).slice(0,n-3);data=shuffle([mo,mo,mo,...others]);
    return {q:`Data nilai: <b>${data.join(', ')}</b>. Berapa modusnya?`,ans:mo,kind:'int',steps:[`Modus = data yang paling sering muncul.`,`${mo} muncul 3 kali, data lain hanya 1 kali. Modus = <b>${mo}</b>.`]}},

  /* ---------- Kelas 9 ---------- */
  sifatPangkat(){const a=R(2,9),m=R(2,8),n=R(2,8);
    if(LV===1){const b=R(2,5),e=R(2,4);return {q:`${b}${sup(e)} = ?`,ans:b**e,kind:'int',steps:[`${b}${sup(e)} = ${Array(e).fill(b).join(' × ')}.`,`= <b>${b**e}</b>.`]}}
    const v=LV===2?R(0,2):3;
    if(v===0)return {q:`${a}${sup(m)} × ${a}${sup(n)} = ${a}${sup('?')}`,ans:m+n,kind:'int',steps:[`Sifat: a${sup('m')} × a${sup('n')} = a${sup('m+n')}.`,`${m} + ${n} = <b>${m+n}</b>.`]};
    if(v===1){const M=m+n;return {q:`${a}${sup(M)} : ${a}${sup(n)} = ${a}${sup('?')}`,ans:m,kind:'int',steps:[`Sifat: a${sup('m')} : a${sup('n')} = a${sup('m−n')}.`,`${M} − ${n} = <b>${m}</b>.`]}}
    if(v===2)return {q:`(${a}${sup(m)})${sup(n)} = ${a}${sup('?')}`,ans:m*n,kind:'int',steps:[`Sifat: (a${sup('m')})${sup('n')} = a${sup('m×n')}.`,`${m} × ${n} = <b>${m*n}</b>.`]};
    const k=R(2,m+n-1);return {q:`(${a}${sup(m)} × ${a}${sup(n)}) : ${a}${sup(k)} = ${a}${sup('?')}`,ans:m+n-k,kind:'int',steps:[`Pangkat dijumlah saat dikali: ${m} + ${n} = ${m+n}.`,`Pangkat dikurang saat dibagi: ${m+n} − ${k} = <b>${m+n-k}</b>.`]}},
  bentukAkar(){const m=pick([2,3,5,6,7]),k=R(2,D(5,9,12)),N=k*k*m;
    if(LV===3){const k2=R(2,8),N2=k2*k2*m;return {q:`√${N} + √${N2} = a√${m}. Berapa nilai a?`,ans:k+k2,kind:'int',
      steps:[`√${N} = √(${k*k} × ${m}) = ${k}√${m}.`,`√${N2} = √(${k2*k2} × ${m}) = ${k2}√${m}.`,`${k}√${m} + ${k2}√${m} = <b>${k+k2}</b>√${m}.`]}}
    return {q:`√${N} = a√${m}. Berapa nilai a?`,ans:k,kind:'int',steps:[`Cari bilangan kuadrat yang menjadi faktor ${N}: ${N} = ${k*k} × ${m}.`,`√${N} = √${k*k} × √${m} = <b>${k}</b>√${m}.`]}},
  persKuadrat(){let p,q;do{p=R(D(1,-9,-12),D(9,9,12));q=R(D(1,-9,-12),D(9,9,12))}while(p===q||!p||!q);const b=-(p+q),c=p*q;
    if(LV===3&&Math.random()<.5){return {q:`Akar-akar persamaan ${poly([[1,'x²'],[b,'x'],[c,'']])} = 0 adalah x₁ dan x₂. Berapa x₁ × x₂?`,ans:c,kind:'int',hint:'Boleh negatif.',
      steps:[`Untuk ax² + bx + c = 0: x₁ × x₂ = c/a.`,`c/a = ${c}/1 = <b>${c}</b>.`]}}
    return {q:`Tentukan akar terbesar dari persamaan:<br>${poly([[1,'x²'],[b,'x'],[c,'']])} = 0`,ans:Math.max(p,q),kind:'int',hint:'Boleh negatif.',
      steps:[`Faktorkan: cari dua bilangan yang dikali = ${c} dan dijumlah = ${b}, yaitu ${-p} dan ${-q}.`,`(x ${-p<0?'−':'+'} ${Math.abs(p)})(x ${-q<0?'−':'+'} ${Math.abs(q)}) = 0, jadi x = ${p} atau x = ${q}.`,`Akar terbesar: <b>${Math.max(p,q)}</b>.`]}},
  fungsiKuadrat(){const a=nz(R(-3,3)),b=R(-6,6),c=R(-10,10),k=R(-4,4);
    if(LV===3){const A=pick([1,2,-1]),h=R(-5,5),B=-2*A*h,C=R(-10,10),yv=A*h*h+B*h+C,askY=Math.random()<.5;
      return {q:`Fungsi f(x) = ${poly([[A,'x²'],[B,'x'],[C,'']])}. Berapa ${askY?'nilai '+(A>0?'minimum':'maksimum')+' fungsi':'x sumbu simetrinya'}?`,ans:askY?yv:h,kind:'int',hint:'Boleh negatif.',
        steps:[`Sumbu simetri x = −b/(2a) = ${-B}/${2*A} = ${h}.`,...(askY?[`f(${h}) = ${A}(${h})² + ${fmtZ(B)}(${h}) + ${fmtZ(C)} = <b>${yv}</b>.`]:[`Jadi x = <b>${h}</b>.`])]}}
    const v=a*k*k+b*k+c;return {q:`Diketahui f(x) = ${poly([[a,'x²'],[b,'x'],[c,'']])}. Berapa nilai f(${k})?`,ans:v,kind:'int',hint:'Boleh negatif.',
      steps:[`Substitusi x = ${k}: f(${k}) = ${a} × ${fmtZ(k)}² + ${fmtZ(b)} × ${fmtZ(k)} + ${fmtZ(c)}.`,`= ${a*k*k} + ${fmtZ(b*k)} + ${fmtZ(c)} = <b>${v}</b>.`]}},
  tabung(){const r=pick(D([7],[7,14],[7,14,21])),t=R(2,20);
    if(LV===3&&Math.random()<.5){const LP=44/7*r*(r+t);return {q:`Berapa cm² luas permukaan tabung dengan jari-jari ${r} cm dan tinggi ${t} cm? (π = ${F(22,7)})`,ans:LP,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Luas permukaan tabung = 2πr(r + t).`,`= 2 × ${F(22,7)} × ${r} × (${r} + ${t}) = 44 × ${r/7} × ${r+t} = <b>${LP}</b> cm².`]}}
    if(LV>1&&Math.random()<.5){const tt=R(1,8)*3,V=22/7*r*r*tt/3;return {q:`Berapa cm³ volume kerucut dengan jari-jari ${r} cm dan tinggi ${tt} cm? (π = ${F(22,7)})`,ans:V,kind:'int',hint:'Tulis angkanya saja.',
      steps:[`Volume kerucut = ${F(1,3)} × π × r² × t.`,`= ${F(1,3)} × ${F(22,7)} × ${r*r} × ${tt} = <b>${V}</b> cm³.`]}}
    const V=22/7*r*r*t;return {q:`Berapa cm³ volume tabung dengan jari-jari ${r} cm dan tinggi ${t} cm? (π = ${F(22,7)})`,ans:V,kind:'int',hint:'Tulis angkanya saja.',

  peluang(){if(LV===3&&Math.random()<.5){const s=R(2,12),cnt=6-Math.abs(s-7);return {q:`Dua dadu dilempar bersamaan. Berapa peluang muncul mata dadu berjumlah ${s}?`,ans:[cnt,36],kind:'frac',hint:'Tulis pecahan seperti 1/6.',

function variedPractice(draw,n){
  const result=[],seen=new Set();
  for(let attempt=0;result.length<n && attempt<16*n;attempt++){
    const q=draw();if(!q)break;
    if(seen.has(q.q))continue;
    seen.add(q.q);result.push(q);
  }
  return shuffle(result);
}
function buildSession(t,n){
  if(t.parts){   // latihan campuran: gabungan topik bank soal dan topik soal otomatis
    const gens=t.parts.filter(p=>!p.bank),bank=t.parts.filter(p=>p.bank).flatMap(p=>p.bank.map(s=>({...s,from:p.name})));
    const pool=shuffle(bank.filter(s=>s.lv===LV)).concat(shuffle(bank.filter(s=>s.lv!==LV))),share=gens.length/t.parts.length,qs=[];
    return variedPractice(()=>gens.length&&(!pool.length||Math.random()<share)?makeQ(pick(gens)):pool.length?bankQ(pool.shift()):null,n)}
  if(!t.bank)return variedPractice(()=>makeQ(t),n);
  let pool=shuffle(t.bank.filter(s=>s.lv===LV));
  if(pool.length<n){const extra=shuffle(t.bank.filter(s=>s.lv!==LV).sort((a,b)=>Math.abs(a.lv-LV)-Math.abs(b.lv-LV)));pool=pool.concat(extra)}
  return pool.slice(0,n).map(bankQ);
}

  const kur=S.kur,k=S.kelas,mp=KURS[kur].mapel,namaTopik={};

  for(const h of S.history){const t=S.topics[h.id],nm=namaTopik[h.id.split('|')[0]];if(t&&nm&&t.best<2){ulangi={nama:nm,best:t.best};break}}

async function sinkron(keepalive){
  if(!AKUN||meresetProgres)return;clearTimeout(sinkronTimer);sinkronTimer=null;
  const v=SV,versi=S.versiProgres??0,data={};PROGRES.forEach(k=>data[k]=S[k]);
  try{const r=await fetch('/api/progres',{method:'POST',credentials:'same-origin',keepalive:!!keepalive,
      headers:{'Content-Type':'application/json','x-bimbel':'1'},body:JSON.stringify({data,versi,ringkasan:ringkasan()})});
    if((!r.ok&&r.status!==409)||keepalive)return;const j=await r.json();
    if(meresetProgres||versi!==(S.versiProgres??0))return;
    if(r.status===409){pakaiResetProgres(j);return}
    if(v!==SV)return jadwalSinkron();   // ada kemajuan baru selama dikirim: kirim ulang nanti
    let beda=false;PROGRES.forEach(k=>{if(JSON.stringify(S[k])!==JSON.stringify(j.data[k])){S[k]=j.data[k];beda=true}});
    if(beda){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}if(!sess&&!ex&&!$('#tanya'))render()}
  }catch(e){}
}

const ATURAN_SP1={salahBeruntun:4,batasJawabMs:2000,jedaMs:5*60*1000};
let timerSP1;
function batasSP1(){
  if(!SKEY)return 0;
  try{return Number(localStorage.getItem(`${SKEY}_sp1`))||0}catch(e){return 0}
}
function catatSP1(ok,s){
  s.salahCepat=!ok&&performance.now()-s.soalMulai<ATURAN_SP1.batasJawabMs
    ? (s.salahCepat||0)+1 : 0;
  if(s.salahCepat<ATURAN_SP1.salahBeruntun||jedaSP1())return false;
  const sampai=Date.now()+ATURAN_SP1.jedaMs;
  try{localStorage.setItem(`${SKEY}_sp1`,String(sampai))}catch(e){}
  batasSP1Sesi=sampai;
  sess=null;
  render();
  window.scrollTo(0,0);
  return true;
}
let batasSP1Sesi=0;
const jedaSP1=()=>Math.max(batasSP1(),batasSP1Sesi);
function tampilSP1(app,sampai){
  app.innerHTML=`<h1>SP 1 · Jeda latihan</h1>
    <p>Beberapa jawaban salah dikirim berturut-turut dengan sangat cepat. Ambil jeda 5 menit sebelum melanjutkan.</p>
    <p>Waktu tersisa <strong id="sisa-sp1" role="timer"></strong></p>`;
  const perbarui=()=>{
    const sisa=sampai-Date.now();
    if(sisa<=0){render();return}
    $('#sisa-sp1').textContent=fmtT(sisa/1000);
    timerSP1=setTimeout(perbarui,250);
  };
  perbarui();
}
window.addEventListener('storage',e=>{
  if(SKEY&&e.key===`${SKEY}_sp1`&&jedaSP1()>Date.now()){sess=null;render()}
});

function render(){clearTimeout(timerSP1);header();const app=$('#app');
  const sampai=jedaSP1();
  if(sampai>Date.now()&&(view==='belajar'||view==='tryout'))return tampilSP1(app,sampai);
  if(sess){ return sess.done?renderResult(app):renderQ(app); }
  ({belajar:renderHome,tryout:renderTryout,medali:renderMedals,laporan:renderReport})[view](app);
}

const kunciAntreanSoal=()=>`${SKEY}_soal`;
let antreanSoal=[], mengirimSoal=null;
const simpanAntreanSoal=()=>{try{localStorage.setItem(kunciAntreanSoal(),JSON.stringify(antreanSoal))}catch(e){}};
function kirimSoal(){
  if(meresetProgres||mengirimSoal||!antreanSoal.length)return mengirimSoal;
  const versi=S.versiProgres??0;
  mengirimSoal=(async()=>{
    while(!meresetProgres&&antreanSoal.length){
      const soal=antreanSoal.slice(0,10);
      const r=await fetch('/api/progres/soal',{method:'POST',headers:{'Content-Type':'application/json','X-Bimbel':'1'},
        body:JSON.stringify({childId:AKUN.id,soal,versi}),keepalive:true});
      if(meresetProgres||versi!==(S.versiProgres??0))break;
      if(r.status===409){pakaiResetProgres(await r.json());break}
      if(!r.ok)break;
      antreanSoal.splice(0,soal.length);simpanAntreanSoal();
    }
  })().catch(()=>{}).finally(()=>{mengirimSoal=null});
  return mengirimSoal;
}
function catatSoal(sesi,nomor,jenis,topik,q,jawaban,benar){
  const teks=document.createElement('template');
  teks.innerHTML=String(q.q);
  teks.content.querySelectorAll('script,style').forEach(el=>el.remove());
  teks.content.querySelectorAll('.frac').forEach(el=>{el.textContent=[...el.children].map(anak=>anak.textContent).join('/')});
  const soal=teks.content.textContent.replace(/\s+/g,' ').trim().slice(0,1500);
  if(soal)antreanSoal.push({sesi,nomor,jenis,topik,soal,jawaban:String(jawaban??'').slice(0,200),benar,waktu:new Date().toISOString()});
  simpanAntreanSoal();
}
function start(id){if(jedaSP1()>Date.now())return render();const t=topicsFor(S.mapel,S.kelas).find(x=>x.id===id)||topicById(id);LV=S.lv;
  const qs=buildSession(t,JUMLAH_SOAL);if(!qs.length){alert('Belum ada soal untuk topik ini.');return}
  sess={t,lv:S.lv,qs,i:0,res:[],streak:0,answered:false,done:false,catatanId:`latihan-${Date.now()}-${Math.random().toString(36).slice(2)}`};render();
}
function ansText(q){if(q.kind==='str')return esc(q.ans);if(q.kind==='frac'){let [n,d]=q.ans;if(d<0){n=-n;d=-d}const g=gcd(n,d);n/=g;d/=g;return d===1?`${n}`:(n<0?'−':'')+F(Math.abs(n),d)}
  return q.kind==='dec'?fmtD(q.ans,2):(Math.abs(q.ans)>=1000?q.ans.toLocaleString('id-ID'):q.ans)}
function check(q,v){
  // Pilihan ganda teks: harus sama persis, termasuk huruf besar/kecil (soal huruf kapital, genotipe Mm/mm).
  if(q.choices&&q.kind==='str'){const t=String(v).trim();return t?t===String(q.ans).trim():null}
  v=String(v).trim().toLowerCase().replace(/−/g,'-');if(!v)return null;
  if(q.kind==='str')return v===String(q.ans).trim().toLowerCase().replace(/−/g,'-');
  if(q.kind==='frac'){
    const mixed=v.match(/^([+-]?)(\d+)\s+(\d+)\s*\/\s*(\d+)$/);
    if(mixed&&!q.simplest){
      const [,sign,whole,part,denominator]=mixed;
      const d=BigInt(denominator),p=BigInt(part);
      const n=(BigInt(whole)*d+p)*(sign==='-'?-1n:1n);
      return p<d&&n*BigInt(q.ans[1])===BigInt(q.ans[0])*d;
    }
    const parts=v.match(/^([+-]?\d+)(?:\s*\/\s*([+-]?\d+))?$/);
    if(!parts)return false;
    const n=Number(parts[1]),d=Number(parts[2]??1);
    if(q.simplest)return n===q.ans[0]&&d===q.ans[1];
    return Number.isSafeInteger(n)&&Number.isSafeInteger(d)&&d!==0
      &&BigInt(n)*BigInt(q.ans[1])===BigInt(q.ans[0])*BigInt(d);
  }
  if(q.kind==='dec'){
    if(!/^[+-]?(?:\d+(?:[.,]\d*)?|[.,]\d+)$/.test(v))return false;
    return Math.abs(Number(v.replace(',','.'))-q.ans)<1e-9;
  }
  const angka=v.replace(/^(?:rp|\$)\s*/, '');
  if(!/^[+-]?(?:\d+|\d{1,3}(?:\.\d{3})+|\d{1,3}(?:,\d{3})+|\d{1,3}(?:\s+\d{3})+)$/.test(angka))return false;
  return Number(angka.replace(/[.,\s]/g,''))===q.ans;
}
function renderQ(app){const s=sess,q=s.qs[s.i];
  if(!s.answered)s.soalMulai??=performance.now();
  const dots=s.qs.map((_,i)=>`<i class="${i<s.res.length?(s.res[i]?'ok':'bad'):(i===s.i?'cur':'')}"></i>`).join('');
  const input=q.choices?`<div class="choices ${q.text?'long':''}">${q.choices.map(c=>`<button class="choice" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>`
    :`<div class="ans"><input id="inp" inputmode="text" autocomplete="off" placeholder="Jawaban"><button class="btn" id="cek">Periksa</button></div>${q.hint?`<div class="hint">${q.hint}</div>`:''}`;
  app.innerHTML=`<div class="practice">
    <div class="phead"><button class="btn ghost" id="keluar">✕</button><div class="dots">${dots}</div></div>
    <div class="qcard">
      <div class="qlabel">${mapelName(s.t)} · ${esc(s.t.name)}${q.from&&(s.t.mix||s.t.g==='__mix')?' · '+esc(q.from):''} · <span class="lvtag lv${s.lv}">${lvName(s.lv,s.t.kur)}</span> · Soal ${s.i+1} dari ${s.qs.length}</div>
      <div class="qtext ${q.text?'small':''}">${q.q}</div>
      ${input}
      <div class="fb" id="fb"></div>
    </div>
    <div class="pfoot"><span style="color:var(--muted);font-weight:700">${s.streak>=2?`🔥 ${s.streak} benar berturut-turut`:''}</span><button class="btn ok" id="next" style="display:none">${s.i<s.qs.length-1?'Soal berikutnya →':'Lihat hasil →'}</button></div>
  </div>`;
  $('#keluar').onclick=()=>{if(confirm('Keluar dari latihan? Hasil sesi ini tidak disimpan.'))go('belajar')};
  if(q.choices){app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(s.answered)return;answer(check(q,b.dataset.c),b)})}
  else{const inp=$('#inp');inp.focus();const f=()=>{if(s.answered)return;const r=check(q,inp.value);if(r===null){inp.focus();return}answer(r)};
    $('#cek').onclick=f;inp.onkeydown=e=>{if(e.key==='Enter'){s.answered?nextQ():f()}}}
  $('#next').onclick=nextQ;
}
function answer(ok,btn){const s=sess;if(!s||s.answered)return;
  if(jedaSP1()>Date.now()){sess=null;return render()}
  catatSoal(s.catatanId,s.i+1,'latihan',s.t.name,s.qs[s.i],btn?.dataset.c??$('#inp')?.value,ok);
  kirimSoal();
  if(catatSP1(ok,s))return;
  const q=s.qs[s.i];s.answered=true;s.res.push(ok);
  if(ok)s.streak++;else s.streak=0;
  if(btn){$('#app').querySelectorAll('.choice').forEach(b=>{if(check(q,b.dataset.c))b.classList.add('right')});if(!ok)btn.classList.add('wrong')}
  const inp=$('#inp');if(inp){inp.disabled=true;inp.style.borderColor=ok?'var(--ok)':'var(--bad)';$('#cek').disabled=true}
  const fb=$('#fb');fb.className='fb show '+(ok?'ok':'bad');
  const steps=`<ol class="steps">${q.steps.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  fb.innerHTML=ok?`<div class="big">Benar!</div>
      <button class="linkbtn" id="lihat">Lihat pembahasan</button><div id="pb" style="display:none">${steps}</div>`
    :`<div class="big">Belum tepat. Jawaban yang benar: ${ansText(q)}</div><div>Yuk lihat caranya:</div>${steps}`;
  if(ok)$('#lihat').onclick=()=>{$('#pb').style.display='block';$('#lihat').remove()};
  const n=$('#next');n.style.display='inline-block';n.focus();
}
function nextQ(){const s=sess;if(!s?.answered)return;if(s.i<s.qs.length-1){s.i++;s.answered=false;s.soalMulai=null;render()}else finish()}
function finish(){const s=sess,c=s.res.filter(Boolean).length,N=s.qs.length,pc=c/N,stars=pc===1?3:pc>=.8?2:pc>=.6?1:0;
  const before=new Set(S.medals),key=`${s.t.id}|${s.lv}`;
  const t=S.topics[key]||{best:0,att:0,ok:0,ses:0};
  const bestSebelum=t.best;
  t.att+=N;t.ok+=c;t.ses++;t.best=Math.max(t.best,stars);S.topics[key]=t;
  s.bintangBaru=t.best-bestSebelum;
  if(s.bintangBaru>0)kirimBintang([{kunci:key,bintang:t.best}]);
  s.sudahTigaBintang=bestSebelum>=3;
  s.xp=s.sudahTigaBintang?0:c*xpPerJawabanLatihan(s.lv);
  S.xp+=s.xp;
  S.sessions++;if(c===N&&N>=5)S.perfect++;
  S.history.unshift({d:new Date().toISOString(),id:key,c,n:N});S.history=S.history.slice(0,50);
  MEDALS.forEach(m=>{if(!before.has(m.id)&&m.ok(S))S.medals.push(m.id)});
  s.newMedals=S.medals.filter(m=>!before.has(m)).map(id=>MEDALS.find(m=>m.id===id));
  s.correct=c;s.stars=stars;s.done=true;save();render();
  if(s.xp>0)kirimXp();
}
function renderResult(app){const s=sess,N=s.qs.length;
  const msg=s.correct===N?'Luar biasa, semua benar!':s.correct/N>=.6?'Bagus! Sedikit lagi sempurna.':'Tidak apa-apa, ayo coba lagi. Lihat pembahasannya ya.';
  const naik=s.stars===3&&s.lv<3?`<p style="font-weight:800;color:var(--teal)">Hebat! Coba tingkat <b>${lvName(s.lv+1,s.t.kur)}</b>?</p>`:'';
  app.innerHTML=`<div class="result">
    <div class="qlabel">${mapelName(s.t)} · ${esc(s.t.name)} · ${(KURS[s.t.kur]||KURS.merdeka).label(s.t.kelas)} · ${lvName(s.lv,s.t.kur)}</div>
    <div class="stars" style="margin-top:10px">${[1,2,3].map(i=>`<span class="${i<=s.stars?'s':''}">★</span>`).join('')}</div>
    <div class="score">${s.correct} / ${N} benar</div>
    <p style="font-weight:700">${msg}</p>${naik}
    ${s.bintangBaru>0?`<div class="stat" style="display:inline-flex">+${s.bintangBaru} bintang</div>`:''}
    <div class="stat" style="display:inline-flex">+${s.xp} XP</div>
    ${s.sudahTigaBintang?'<p class="sub">Kamu sudah meraih 3 bintang pada topik dan tingkat ini.</p>':''}
    ${s.newMedals.map(m=>`<div class="newmedal">Medali baru! ${m.e} <b>${m.n}</b></div>`).join('')}
    <div style="display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap">
      <button class="btn ghost" id="home">Kembali ke topik</button>${naik?`<button class="btn ghost" id="up">Coba ${lvName(s.lv+1,s.t.kur)}</button>`:''}<button class="btn" id="again">Latihan lagi</button></div>
  </div>`;
  $('#home').onclick=()=>go('belajar');$('#again').onclick=()=>start(s.t.id);
  if(naik)$('#up').onclick=()=>{S.lv=s.lv+1;save();start(s.t.id)};
}

  <div class="grid">${MEDALS.map(m=>{const got=S.medals.includes(m.id);return `<div class="item ${got?'':'locked'}"><div class="em">${m.e}</div><h3>${m.n}</h3><p style="margin:0;color:var(--muted);font-size:14px">${m.d}</p></div>`}).join('')}</div>`;

function renderReport(app){
  const keys=Object.keys(S.topics);
  const th=tryoutHist(10),thBlock=th?`<h2 style="margin-top:28px">Riwayat tryout</h2>${th}`:'';
  if(!keys.length){app.innerHTML=`<h1>Laporan Orang Tua</h1><p class="sub">Pantau perkembangan belajar anak per topik.</p><div class="empty">Belum ada latihan. Laporan akan muncul setelah anak menyelesaikan sesi pertama.</div>${thBlock}`;return}
  let att=0,ok=0;keys.forEach(i=>{att+=S.topics[i].att;ok+=S.topics[i].ok});
  const rows=keys.map(key=>{const [id,lvs]=key.split('|'),t=topicById(id)||{name:id,desc:'',kelas:'-',mapel:'mat',kur:'merdeka'},st=S.topics[key],p=Math.round(st.ok/st.att*100),cls=p<60?'lo':p<85?'mid':'hi';
    return {t,st,p,cls,lv:+(lvs||2)}}).sort((a,b)=>a.p-b.p);
  const weak=rows.filter(r=>r.p<60),strong=rows.filter(r=>r.p>=85);
  const last=S.history[0]?new Date(S.history[0].d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'-';
  app.innerHTML=`<h1>Laporan Orang Tua</h1><p class="sub">Perkembangan belajar ${esc(S.name||'anak')} · terakhir berlatih ${last}</p>
  <div class="summary">
    <div class="sbox"><div class="k">Soal dikerjakan</div><div class="v">${att}</div></div>
    <div class="sbox"><div class="k">Jawaban benar</div><div class="v">${Math.round(ok/att*100)}%</div></div>
    <div class="sbox"><div class="k">Sesi latihan</div><div class="v">${S.sessions}</div></div>
    <div class="sbox"><div class="k">Level</div><div class="v">${level()}</div></div>
  </div>
  <div style="overflow-x:auto"><table><thead><tr><th>Pelajaran & topik</th><th>Kelas</th><th>Tingkat</th><th>Soal</th><th>Ketepatan</th><th>Status</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><span style="color:var(--muted);font-size:13px">${(KURS[r.t.kur]||KURS.merdeka).short} · ${mapelName(r.t)}</span><br><b>${esc(r.t.name)}</b></td><td>${r.t.kur?(KURS[r.t.kur]).label(r.t.kelas):'-'}</td><td><span class="lvtag lv${r.lv}">${LVNAME[r.lv]}</span></td><td>${r.st.att}</td>
    <td><div class="acc"><div class="bar"><i class="${r.cls}" style="width:${r.p}%"></i></div>${r.p}%</div></td>
    <td><span class="pill ${r.cls}">${r.cls==='lo'?'Perlu latihan':r.cls==='mid'?'Berkembang':'Sudah kuat'}</span></td></tr>`).join('')}

/* ============ Tryout / Mode Ujian ============ */
let EXKEY='ruangpintar_ujian';   // diganti per anak di mulai()
let ex=null, exTimer=null;
// ===== PENGATURAN PUSAT: komposisi tingkat soal tryout =====
// Ubah angka di sini saja (dalam persen). Sisa dari sulit + sedang otomatis menjadi soal mudah.
// Anak tidak melihat dan tidak bisa mengubah pengaturan ini.
const TRYOUT_TINGKAT={sulit:70,sedang:20};
const TO={n:30,menit:60,lv:0,rf:'all'};          // lv 0 = komposisi TRYOUT_TINGKAT
const TO_N=[30,50],TO_MENIT=[60,90];
const mixShort=kur=>kur&&kur!=='merdeka'?'Random':'Acak';
// Tryout hanya 1x sehari per pelajaran (dihitung sejak tryout dimulai, jadi membatalkan tetap memakai jatah).
const hariIni=()=>{const d=new Date();return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`};
const sudahTryout=(kur,mapel)=>(S.tryoutHari||{})[`${kur}|${mapel}`]===hariIni();
// Bintang tryout dari jumlah soal yang tidak benar.
// 30 soal: 30 benar = 3, 27–29 = 2, 21–26 = 1. 50 soal: 50 = 5, 47–49 = 4, 44–46 = 3, 41–43 = 2, 35–40 = 1.
function tryoutStars(correct,n,target){
  const max=(target||(n>=40?50:30))===50?5:3,miss=n-correct;
  const batas=max===5?[0,3,6,9,15]:[0,3,9];   // salah maksimal untuk max, max-1, ... bintang
  const i=batas.findIndex(b=>miss<=b);return {stars:i<0?0:max-i,max};
}
const starsOf=(n,max)=>`<span class="stars">${Array.from({length:max},(_,i)=>`<span class="${i<n?'s':''}">★</span>`).join('')}</span>`;
// Daftar tingkat untuk n soal menurut TRYOUT_TINGKAT: sulit (3), sedang (2), sisanya mudah (1), urutan diacak.
function mixLevels(n){const h=Math.min(n,Math.round(n*TRYOUT_TINGKAT.sulit/100)),m=Math.min(n-h,Math.round(n*TRYOUT_TINGKAT.sedang/100));return shuffle([...Array(h).fill(3),...Array(m).fill(2),...Array(Math.max(0,n-h-m)).fill(1)])}
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
const isAns=a=>a!==null&&a!==undefined&&String(a).trim()!=='';
function exSave(){try{ex&&!ex.done?localStorage.setItem(EXKEY,JSON.stringify(ex)):localStorage.removeItem(EXKEY)}catch(e){}}
const tryoutTopics=()=>topicsFor(S.mapel,S.kelas).filter(t=>!t.mix&&t.g!=='__mix');

// Soal tryout dari semua topik secara bergiliran, mengikuti komposisi tingkat mixLevels().
// Bila satu tingkat habis (bank soal terbatas), dipakai tingkat terdekat.
function buildExam(topics,n){
  const pools=shuffle(topics.map(t=>t.bank?{t,bank:{1:shuffle(t.bank.filter(s=>s.lv===1)),2:shuffle(t.bank.filter(s=>s.lv===2)),3:shuffle(t.bank.filter(s=>s.lv===3))}}:{t,gen:true}));
  const qs=[],seen=new Set();let k=0;
  const take=(p,lv)=>{
    if(p.gen){for(let tr=0;tr<5;tr++){LV=lv;let q;try{q=makeQ(p.t)}catch(e){return null}if(!seen.has(q.q)){q.lv=lv;return q}}return null}
    const b=p.bank[lv];while(b.length){const s=b.pop(),q=bankQ(s);if(!seen.has(q.q)){q.lv=s.lv;return q}}return null;
  };
  for(const lv of mixLevels(n)){
    let q=null;
    for(const l of [3,2,1].sort((a,b)=>Math.abs(a-lv)-Math.abs(b-lv))){
      for(let j=0;j<pools.length&&!q;j++){const p=pools[(k+j)%pools.length];q=take(p,l);if(q){q.topic=p.t.name;k=(k+j+1)%pools.length}}
      if(q)break;
    }
    if(!q)break;
    seen.add(q.q);qs.push(q);
  }
  return shuffle(qs);
}

function tryoutHist(limit){
  const h=(S.tryouts||[]).slice(0,limit);if(!h.length)return '';
  return `<div style="overflow-x:auto"><table><thead><tr><th>Tanggal</th><th>Pelajaran</th><th>Nilai</th><th>Bintang</th><th>Benar</th><th>Waktu</th></tr></thead><tbody>
  ${h.map(t=>{const K=KURS[t.kur]||KURS.merdeka,cls=t.score<60?'lo':t.score<75?'mid':'hi';
    return `<tr><td>${new Date(t.d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</td>
    <td><span style="color:var(--muted);font-size:13px">${K.short} · ${K.label(t.kelas)}</span><br><b>${K.mapel[t.mapel]||t.mapel}</b></td>
    <td><span class="pill ${cls}" style="font-size:15px">${t.score}</span></td><td>${t.max?starsOf(t.stars,t.max):'–'}</td><td>${t.c} / ${t.n}</td><td>${fmtT(t.used)} <span style="color:var(--muted)">/ ${t.menit} mnt</span></td></tr>`}).join('')}
  </tbody></table></div>`;
}

    <div class="grades">${Object.entries(K.mapel).map(([m,nm])=>`<button class="chip ${S.mapel===m?'on':''}" data-m="${m}">${nm}</button>`).join('')}</div>

          <span style="color:var(--muted);font-weight:700">${K.mapel[S.mapel]} · ${K.label(S.kelas)} · ${chosen.length} topik · ${mixShort(S.kur)}${n<TO.n&&chosen.length?` · soal yang tersedia hanya ${n}`:''}</span></div>
        ${sudah?`<span style="font-weight:800;color:var(--muted)">Tryout ${K.mapel[S.mapel]} hari ini sudah dikerjakan. Coba lagi besok.</span>`

      ${hist?`<div><h2 style="margin-top:8px">Riwayat tryout</h2>${hist}</div>`:''}

  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mapel=b.dataset.m;save();render()});

  const m=$('#tmulai');if(m)m.onclick=startExam;

function startExam(){
  if(jedaSP1()>Date.now())return render();
  if(sudahTryout(S.kur,S.mapel)){alert('Tryout pelajaran ini hari ini sudah dikerjakan. Coba lagi besok, ya.');return}
  const qs=buildExam(tryoutTopics(),TO.n);
  if(!qs.length){alert('Belum ada soal untuk kelas ini.');return}
  S.tryoutHari=Object.assign({},S.tryoutHari,{[`${S.kur}|${S.mapel}`]:hariIni()});save();
  const now=Date.now();
  ex={kur:S.kur,mapel:S.mapel,kelas:S.kelas,lv:TO.lv,target:TO.n,menit:TO.menit,qs,ans:qs.map(()=>null),flag:qs.map(()=>false),i:0,start:now,end:now+TO.menit*60000,done:false};
  TO.rf='all';exSave();render();window.scrollTo(0,0);
}
function startTimer(){
  clearInterval(exTimer);

}

function submitExam(auto,yakin){
  if(!ex||ex.done)return;
  if(!auto&&!yakin){const kosong=ex.ans.filter(a=>!isAns(a)).length,ragu=ex.flag.filter(Boolean).length;
    tanya(`Kumpulkan jawaban sekarang?${kosong?`\n• ${kosong} soal belum dijawab`:''}${ragu?`\n• ${ragu} soal ditandai ragu-ragu`:''}`,'Ya, kumpulkan',()=>submitExam(false,true));return}
  clearInterval(exTimer);tutupTanya();
  ex.res=ex.qs.map((q,i)=>isAns(ex.ans[i])?!!check(q,ex.ans[i]):null);
  ex.qs.forEach((q,i)=>{if(ex.res[i]!==null)catatSoal(`tryout-${ex.start}`,i+1,'tryout',q.topic, q,ex.ans[i],ex.res[i])});
  kirimSoal();
  ex.correct=ex.res.filter(r=>r===true).length;
  ex.score=Math.round(ex.correct/ex.qs.length*100);
  ex.used=Math.min(ex.menit*60,Math.round((Date.now()-ex.start)/1000));
  ex.auto=auto;ex.done=true;ex.xp=ex.correct*XP_PER_JAWABAN_TRYOUT;
  Object.assign(ex,tryoutStars(ex.correct,ex.qs.length,ex.target));
  kirimBintang([{kunci:`tryout|${tglWIB()}|${ex.kur}|${ex.mapel}`,bintang:ex.stars}]);
  const before=new Set(S.medals);
  S.xp+=ex.xp;
  S.tryouts=[{d:new Date().toISOString(),kur:ex.kur,mapel:ex.mapel,kelas:ex.kelas,lv:ex.lv,score:ex.score,c:ex.correct,n:ex.qs.length,used:ex.used,menit:ex.menit,stars:ex.stars,max:ex.max}].concat(S.tryouts||[]).slice(0,30);
  MEDALS.forEach(m=>{if(!before.has(m.id)&&m.ok(S))S.medals.push(m.id)});
  ex.newMedals=S.medals.filter(m=>!before.has(m));
  save();exSave();view='tryout';sess=null;render();window.scrollTo(0,0);kirimXp();
  // Bila waktu habis, halaman hasil sudah menulis "Waktu habis, jawaban dikumpulkan otomatis."
}

        <div class="qlabel" style="color:${r===true?'var(--ok)':r===false?'var(--bad)':'var(--muted)'}">Soal ${i+1} · ${r===true?'Benar':r===false?'Salah':'Tidak dijawab'} · ${esc(q.topic||'')}</div>
        <div class="rq">${q.q}</div>
        <div class="ra">Jawabanmu: <b>${isAns(ex.ans[i])?esc(ex.ans[i]):'–'}</b> · Jawaban benar: <b style="color:var(--ok)">${ansText(q)}</b></div>
        <ol class="steps">${(q.steps||[]).map(x=>`<li>${x}</li>`).join('')}</ol>
      </div>`).join('')||`<div class="empty">Semua jawaban benar. Tidak ada yang perlu dibahas. 🎉</div>`}</div>
    <div style="display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap">
      <button class="btn" id="eback">Kembali ke Tryout</button></div>`;
  app.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{TO.rf=b.dataset.rf;render()});
  $('#eback').onclick=()=>{ex=null;render();window.scrollTo(0,0)};
}
/* ============ Bintang, XP, dan aura (disimpan di server). Toko aksesori tidak ditampilkan di Ruang Pintar. ============ */
let TOKO=null;   // { bintang, punya, pakai, items } dari /api/toko
const tglWIB=()=>new Date(Date.now()+7*3600e3).toISOString().slice(0,10);   // hari menurut server (WIB)
async function tokoApi(method,path,body){
  const r=await fetch('/api/'+path,{method,credentials:'same-origin',headers:{'Content-Type':'application/json','x-bimbel':'1'},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Gagal menghubungi server.');return j;
}
function setToko(j){const auraLama=TOKO&&('aura' in TOKO)?TOKO.aura:undefined;   // undefined = baru dimuat, jangan ucapkan selamat
  TOKO=Object.assign(TOKO||{},{bintang:j.bintang,punya:j.punya,pakai:j.pakai},j.items?{items:j.items}:{},
    'xp' in j?{xp:j.xp,level:j.level,aura:j.aura,auraNama:j.auraNama,auraBerikut:j.auraBerikut}:{});header();
  if('aura' in j&&auraLama!==undefined&&auraLama!==j.aura){segarkanAvatar();if(j.aura)setTimeout(()=>tanya(`✨ Selamat! Kamu naik ke Level ${j.level} dan mendapat ${j.auraNama}! Avatarmu sekarang bercahaya di arena.`,'Hore!',()=>{}),300)}}
// Level & aura: total XP dikirim ke server (server menyimpan yang terbesar). Bila server punya XP lebih
// besar (mis. dari perangkat lain), XP di browser ini ikut naik.
async function kirimXp(){
  if(!AKUN)return;
  try{const j=await tokoApi('POST','xp',{total:S.xp});setToko(j);if(j.xp>S.xp){S.xp=j.xp;save()}
    if(!sess&&view==='belajar'&&!$('#tanya'))render()}catch(e){}
}
// Kirim bintang terbaik ke server; saldo hanya bertambah kalau bintang terbaik naik.
async function kirimBintang(items){
  items=items.filter(i=>i.bintang>0);if(!items.length||!AKUN)return;
  try{const j=await tokoApi('POST','bintang',{items});setToko(j)}catch(e){}
}
function avaSrc(coba){return `/api/avatar.svg?v=${encodeURIComponent(AKUN.avatar+AKUN.color+(TOKO?TOKO.pakai.join(',')+(TOKO.aura||''):''))}${coba?'&coba='+encodeURIComponent(coba):''}`}
function segarkanAvatar(){$('#ava').innerHTML=`<img src="${avaSrc()}" alt="Avatar ${esc(AKUN.name)}">`}
/* ============ Akun: nama, avatar, kurikulum, dan kelas semuanya dari orang tua ============ */
function pakaiAkun(){
  S.name=AKUN.name;S.kelas=AKUN.kelas;S.kur=KURS[AKUN.kurikulum]?AKUN.kurikulum:'merdeka';
  if(!KURS[S.kur].mapel[S.mapel])S.mapel=Object.keys(KURS[S.kur].mapel)[0];
}

/* ============ Masuk: wajib akun anak dari orang tua ============ */
function gerbang(me){
  const isi=me&&me.anak&&!me.anak.kelas
    ?`<h2>Kelas belum diatur</h2><p>Minta orang tua memilih kelas dan kurikulum sekolahmu di dashboard orang tua (bagian Pengaturan).</p>
      <a class="btn" href="/orangtua.html" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px">Dashboard orang tua</a>
      <button class="btn ghost" id="lagi" style="width:100%">Sudah diatur? Muat ulang</button>`
    :me===null
    ?`<h2>Tidak bisa memeriksa akun</h2><p>Ruang Pintar perlu tersambung ke server Bimbel Pro. Periksa koneksi, lalu coba lagi.</p>
      <button class="btn" id="lagi" style="width:100%">Coba lagi</button>`
    :`<h2>Masuk dulu, ya</h2><p>Ruang Pintar hanya untuk anak yang sudah punya akun dari orang tua.</p>
      <p style="color:var(--muted)"><b>Anak:</b> masuk dengan kode dari orang tua.<br><b>Orang tua:</b> daftar, lalu buat akun anak di dashboard.</p>
      <a class="btn" href="/" style="display:block;text-align:center;text-decoration:none;margin-bottom:10px">Ke halaman masuk</a>
      <a class="btn ghost" href="/orangtua.html" style="display:block;text-align:center;text-decoration:none">Dashboard orang tua</a>`;
  $('#app').innerHTML=`<section class="mbox">${isi}</section>`;
  const l=$('#lagi');if(l)l.onclick=()=>location.reload();
}
function pantauBelajarArena(){
  const tab=Array.from(crypto.getRandomValues(new Uint8Array(16)),n=>n.toString(16).padStart(2,'0')).join('');
  const kirim=mulai=>fetch('/api/belajar/arena',{
    method:'POST',headers:{'Content-Type':'application/json','X-Bimbel':'1'},
    body:JSON.stringify({childId:AKUN.id,tab,mulai}),keepalive:true
  }).catch(()=>{});
  let detak;
  const kabari=()=>{if(!document.hidden)kirim(true)};
  const mulai=()=>{
    clearInterval(detak);kabari();
    detak=setInterval(kabari,20000);
  };
  window.addEventListener('pagehide',()=>{clearInterval(detak);kirim(false)});
  window.addEventListener('pageshow',e=>{if(e.persisted)mulai()});
  document.addEventListener('visibilitychange',kabari);
  mulai();
}
async function mulai(){
  let me=null;
  try{const r=await fetch('/api/saya',{credentials:'same-origin'});if(r.ok)me=await r.json()}catch(e){}
  if(me?.ortu&&!me.anak){
    $('#app').innerHTML='<h2>Ruang Pintar khusus akun anak</h2><p><a href="/orangtua.html#report">Lihat laporan belajar di Dashboard Orang Tua</a></p>';
    return;
  }
  if(!me||!me.anak||!me.anak.kelas){$('#app').innerHTML='';return gerbang(me)}
  AKUN=me.anak;SKEY=`ruangpintar_a${AKUN.id}`;EXKEY=`ruangpintar_ujian_a${AKUN.id}`;
  try{antreanSoal=JSON.parse(localStorage.getItem(kunciAntreanSoal())||'[]')}catch(e){}
  kirimSoal();
  window.addEventListener('online',kirimSoal);
  $('#kembali-arena').hidden=new URLSearchParams(location.search).get('dari')!=='arena';
  try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(SKEY)||'{}'))}catch(e){S=Object.assign({},DEF)}
  pakaiAkun();save();sinkron();   /* ambil kemajuan dari perangkat lain sekarang juga */
  segarkanAvatar();
  /* saldo bintang Toko; bintang lama dari latihan ikut dikirim (server hanya menambah yang naik) */
  tokoApi('GET','toko').then(j=>{setToko(j);segarkanAvatar();kirimBintang(Object.entries(S.topics).map(([k,t])=>({kunci:k,bintang:t.best||0})));kirimXp()}).catch(()=>{});
  /* lanjutkan tryout yang belum selesai (mis. setelah halaman di-refresh) */
  try{const sx=JSON.parse(localStorage.getItem(EXKEY)||'null');if(sx&&!sx.done&&sx.qs&&sx.qs.length){ex=sx;view='tryout'}}catch(e){}
  render();
  pantauBelajarArena();
}
mulai();
</script>
