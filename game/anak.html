<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Anak</title>
    <link rel="stylesheet" href="/src/orangtua.css" />
    <link rel="stylesheet" href="/src/avatar.css" />
    <link rel="stylesheet" href="/src/anak.css" />
  </head>
  <body class="hal-anak">
    <header class="top">
      <strong>Bimbel Pro</strong>
    </header>

    <main>
      <p id="memuat" class="muted">Memuat…</p>

      <!-- Belum masuk sebagai anak -->
      <section id="belum" class="panel" hidden>
        <h2>Masuk dulu, ya</h2>
        <p class="muted">Masuk dengan nama pengguna dan kata sandi dari orang tua.</p>
        <div><a class="btn btn-utama" href="/">Masuk sebagai anak</a></div>
      </section>

      <!-- Dashboard anak: menu samping, isi tiap menu digambar oleh anak.js -->
      <section id="dash" class="dash" hidden>
        <nav class="side" id="menu" aria-label="Menu dashboard">
          <button data-ke="home" class="on">🏠 Home</button>
          <button data-ke="tugas">✅ Tugas</button>
          <button data-ke="arena">🌍 Arena</button>
          <button data-ke="bimbel">📚 Bimbel</button>
          <button data-ke="keuangan">💰 Keuangan</button>
          <button data-ke="report">📊 Report</button>
          <button data-ke="chat">💬 Chat <span id="chat-badge" class="badge" hidden></span></button>
          <button data-ke="avatar">🐻 Avatar</button>
          <button data-ke="toko">🛍️ Toko Avatar</button>
        </nav>
        <div class="isi">
          <div class="judul-hal">
            <div>
              <h1 id="judul"></h1>
              <p id="sub" class="muted"></p>
            </div>
          </div>
          <div id="halaman" class="halaman"></div>
          <p id="galat" class="error" hidden></p>
        </div>
      </section>
    </main>

    <script type="module" src="/src/anak.js"></script>
  <dialog id="alarm-editor" aria-labelledby="alarm-edit-judul"><form id="alarm-form">
    <h2 id="alarm-edit-judul">Tambah alarm</h2>
    <label>Jam <input name="jam" type="time" required></label>
    <label>Nama alarm <input name="nama" maxlength="60" placeholder="Alarm"></label>
    <label><input type="checkbox" name="harian"> Ulangi setiap hari</label>
    <div><button type="button" id="alarm-kembali">Batal</button> <button>Simpan</button></div>
  </form></dialog>
  <dialog id="alarm-pesan" aria-labelledby="alarm-judul"><h2 id="alarm-judul">⏰ Alarm berbunyi</h2><p id="alarm-rincian"></p><form method="dialog"><button>Tutup</button></form></dialog>
</body>
</html>
